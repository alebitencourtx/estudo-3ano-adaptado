<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cada lixo na sua lixeira — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  jogo-topo,barra-progresso,tela-fim{display:block}
  .lixeira .cor{color:var(--muted);font-size:.85rem;font-weight:700}
  .lixeira .encaixados{min-height:56px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Cada lixo na sua lixeira (impactos ambientais — coleta seletiva, livro p. 113) =====
   Classificar 4 lixos nas 4 lixeiras da coleta seletiva: papel (azul),
   plástico (vermelha), vidro (verde) e metal (amarela).
   Dois modos: arrastar (dedo/mouse) e tocar (toca no cartão e depois na lixeira).
   Regras TEA: 1 instrução, frases curtas, sem cronômetro; erro sem punição
   (mostra a frase certa e destaca a lixeira certa).
   Ícones: Twemoji (CC-BY 4.0). Texto base: livro do 3º ano, p. 113. */

const ID = 'imp-reciclagem';
const TOTAL = 4;

/* classes de cor prontas no kit: .lixeira.azul / .vermelha / .verde / .amarela
   (a classe .alvo é o que liga o arrastar e o tocar do JogoKit) */
const LIXEIRAS = [
  { id: 'azul',     nome: 'Papel',    ico: '📄' },
  { id: 'vermelha', nome: 'Plástico', ico: '🧴' },
  { id: 'verde',    nome: 'Vidro',    ico: '🍶' },
  { id: 'amarela',  nome: 'Metal',    ico: '🥫' }
];

const PECAS = [
  { id: 'papel',   alvo: 'azul',     ico: '../../img/jogo/imp/papel.svg',   nome: 'Jornal e papel',      msg: 'O papel vai na lixeira azul.' },
  { id: 'garrafa', alvo: 'vermelha', ico: '../../img/jogo/imp/garrafa.svg', nome: 'Garrafa de plástico', msg: 'O plástico vai na lixeira vermelha.' },
  { id: 'vidro',   alvo: 'verde',    ico: '../../img/jogo/imp/vidro.svg',   nome: 'Vidro',               msg: 'O vidro vai na lixeira verde.' },
  { id: 'lata',    alvo: 'amarela',  ico: '../../img/jogo/imp/lata.svg',    nome: 'Lata de metal',       msg: 'O metal vai na lixeira amarela.' }
];

const APOIO = 'Na coleta seletiva, cada material vai para uma lixeira de cor diferente.';
const HINT = 'Arraste o lixo para a lixeira certa. Ou toque no lixo e depois na lixeira.';
const LEMBRETE = 'Reduzir é consumir menos. Reutilizar é usar de novo. Reciclar é transformar em algo novo.';

const CREDITOS = [
  'Ícones de papel, garrafa, vidro e lata: Twemoji, CC-BY 4.0.',
  'Texto base: livro do 3º ano, p. 113 (coleta seletiva: papel na lixeira azul, plástico na vermelha, vidro na verde, metal na amarela).'
];

const RODAPE = '<p class="rodape"><a href="index.html">← Os 5 jogos</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary>'
  + '<p>' + JogoKit.esc(LEMBRETE) + '</p>'
  + '<ul>' + CREDITOS.map(c => '<li>' + JogoKit.esc(c) + '</li>').join('') + '</ul>'
  + '</details>';

const app = document.getElementById('app');
let S = null;                       /* { colocadas, primeiras } */

/* componentes web criados por innerHTML: garante que já renderizaram */
function montarComponentes() {
  app.querySelectorAll('jogo-topo,barra-progresso,tela-fim').forEach(el => {
    if (!el.firstElementChild && typeof el.connectedCallback === 'function') el.connectedCallback();
  });
}

function atualizar() {
  const cont = app.querySelector('jogo-topo [data-contador]');
  if (cont) cont.textContent = S.colocadas + '/' + TOTAL;
  const bar = app.querySelector('barra-progresso');
  if (bar) {
    if (!bar.querySelector('.bar') && typeof bar.render === 'function') bar.render();
    if (typeof bar.atualizar === 'function') bar.atualizar(S.colocadas, TOTAL);
  }
}

function diz(texto, ok) {
  const f = app.querySelector('#feed');
  if (!f) return;
  f.textContent = texto;
  f.className = 'feed ' + (ok ? 'ok' : 'bad');
}

function pulso(el) {
  el.classList.add('pulso');
  setTimeout(() => el.classList.remove('pulso'), 1400);
}

/* ---------- tela do jogo ---------- */
function renderJogo() {
  JogoKit.arrasto.limpar();
  S = { colocadas: 0, primeiras: 0 };
  const pecas = JogoKit.embaralhar(PECAS);

  app.innerHTML =
    '<jogo-topo icone="♻️" titulo="Cada lixo na sua lixeira" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>'
    + '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>'
    + '<section class="card">'
      + '<p class="pergunta">Onde vai cada lixo?</p>'
      + '<fala-botoes texto="' + JogoKit.esc(APOIO) + '"></fala-botoes>'
      + '<p class="hint">' + JogoKit.esc(HINT) + '</p>'
      + '<div class="lixeiras" id="lixeiras" style="margin-top:16px">'
        + LIXEIRAS.map(l =>
            '<div class="lixeira alvo ' + l.id + '" data-id="' + l.id + '" role="button" tabindex="0"'
            + ' aria-label="Lixeira ' + l.id + ': ' + JogoKit.esc(l.nome) + '">'
            + '<div class="tampa" aria-hidden="true"></div>'
            + '<div class="nome">' + JogoKit.esc(l.nome) + '</div>'
            + '<div class="cor">' + l.id + '</div>'
            + '<div class="encaixados"></div>'
          + '</div>').join('')
      + '</div>'
      + '<div class="bandeja" id="bandeja">'
        + pecas.map(p => JogoKit.pecaHtml(p)).join('')
      + '</div>'
      + '<p class="feed" id="feed" aria-live="polite"></p>'
    + '</section>'
    + RODAPE;

  montarComponentes();
  atualizar();

  const topo = app.querySelector('jogo-topo');
  if (topo) topo.addEventListener('voltar', () => { location.href = 'index.html'; });

  app.querySelectorAll('.peca').forEach(peca => JogoKit.arrasto.ligar(peca, soltar, falarNome));
  app.querySelectorAll('.lixeira').forEach(lix => JogoKit.arrasto.ligarAlvo(lix, soltar));
  window.scrollTo(0, 0);
}

function falarNome(peca) {
  if (!peca) return;
  const n = peca.querySelector('.nome');
  if (n) JogoKit.falar(n.textContent, 0.85);
}

/* ---------- soltar o lixo: certo ou errado ---------- */
function soltar(peca, alvo) {
  if (!peca || !alvo || peca.dataset.feita) return;
  const certo = peca.dataset.alvo === alvo.dataset.id;
  const tent = +peca.dataset.tent || 0;

  if (certo) {
    peca.dataset.feita = '1';
    if (tent === 0) S.primeiras++;
    peca.classList.add('encaixada');
    alvo.classList.add('feita');
    const caixa = alvo.querySelector('.encaixados');
    if (caixa) caixa.appendChild(peca);
    JogoKit.arrasto.limpar();
    S.colocadas++;
    diz('✓ ' + peca.dataset.msg, true);
    JogoKit.falar(peca.dataset.msg, 0.85);
    atualizar();
    if (S.colocadas === TOTAL) setTimeout(renderFim, 900);
  } else {
    peca.dataset.tent = tent + 1;
    diz('✗ ' + peca.dataset.msg, false);
    JogoKit.falar(peca.dataset.msg, 0.85);
    pulso(peca);
    /* o lixo continua selecionado: é só tocar na lixeira certa */
    const bom = app.querySelector('.lixeira[data-id="' + peca.dataset.alvo + '"]');
    if (bom) {
      bom.classList.add('brilho');
      setTimeout(() => bom.classList.remove('brilho'), 2200);
    }
  }
}

/* ---------- tela final ---------- */
function renderFim() {
  JogoKit.arrasto.limpar();
  const a = S.primeiras, n = TOTAL;
  JogoKit.progresso.melhor(ID, a);
  const msg = a === n ? 'Você acertou tudo de primeira! Muito bem!'
    : (a === n - 1 ? 'Muito bem! Quase tudo de primeira.'
    : 'Você acertou ' + a + ' de ' + n + ' de primeira. Pode jogar de novo.');

  app.innerHTML =
    '<tela-fim icone="♻️" titulo="Cada lixo na sua lixeira" estrelas="' + a + '" total="' + n + '"'
    + ' resumo="Tudo na lixeira certa!" msg="' + JogoKit.esc(msg) + '"></tela-fim>'
    + RODAPE;

  montarComponentes();

  const tf = app.querySelector('tela-fim');
  if (tf) tf.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();
    else location.href = 'index.html';
  });

  JogoKit.falar('Tudo na lixeira certa! Você acertou ' + a + ' de ' + n + ' de primeira.', 0.85);
  window.scrollTo(0, 0);
}

renderJogo();
</script>
</body>
</html>
