<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Os serviços públicos — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
.foto-apoio{width:100%;max-height:180px;object-fit:cover;border-radius:12px;border:2px solid var(--line);margin:0 0 10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';
  const esc = JogoKit.esc;
  const ID_PROG = 'imp-servicos';
  const RODADAS = [
    {
      pergunta: 'Toque nos 4 serviços públicos.',
      fichas: [
        {nome:'Atendimento de saúde', id:'saude'}, {nome:'Escola (educação)', id:'escola'},
        {nome:'Coleta de lixo', id:'lixo'}, {nome:'Segurança', id:'seguranca'},
        {nome:'Plantar árvores', id:'plantar'}, {nome:'Separar o lixo reciclável', id:'reciclar'}
      ],
      certas: ['Atendimento de saúde', 'Escola (educação)', 'Coleta de lixo', 'Segurança'],
      msg: 'Saúde, educação, coleta de lixo e segurança são serviços públicos.',
      img: '../../img/hga/imp/fila-servicos.jpg'
    },
    {
      pergunta: 'Toque nos 3 problemas da cidade.',
      fichas: [
        {nome:'Esgoto sem tratamento', id:'esgoto'}, {nome:'Moradia em área de risco', id:'moradia'},
        {nome:'Engarrafamento', id:'engarrafamento'}, {nome:'Coleta seletiva', id:'coleta'},
        {nome:'Plantar árvores', id:'plantar'}
      ],
      certas: ['Esgoto sem tratamento', 'Moradia em área de risco', 'Engarrafamento'],
      msg: 'Esgoto, moradia em área de risco e engarrafamento são problemas da cidade.'
    }
  ];
  const FECHAMENTO = 'Quando os serviços públicos são ruins, a vida das pessoas e as atividades econômicas da cidade ficam prejudicadas.';
  const rodape = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
                 '<details class="detalhes"><summary>Créditos das imagens</summary><p>' + esc(FECHAMENTO) + '</p></details>';

  const app = document.getElementById('app');
  let i = 0, acertos = 0;

  function rodada() {
    const r = RODADAS[i];
    app.innerHTML = '<jogo-topo icone="🏥" titulo="Os serviços públicos" contador="' + (i + 1) + '/2"></jogo-topo>' +
                    '<barra-progresso valor="' + i + '" total="2"></barra-progresso>' +
                    '<section class="card">' +
                    '<fala-botoes texto="Os serviços públicos são saúde, educação, coleta de lixo e segurança."></fala-botoes>' +
                    (r.img ? '<img class="foto-apoio" src="' + esc(r.img) + '">' : '') +
                    '<div data-game></div>' +
                    '</section>' + rodape;
    const ft = document.createElement('fichas-toque');
    ft.montar(r);
    app.querySelector('[data-game]').appendChild(ft);
    ft.addEventListener('conferido', function(e) {
      if (e.detail && e.detail.ok) acertos++;
      JogoKit.falar(e.detail.ok ? '✓ ' + r.msg : '✗ ' + r.msg, 0.85);
      setTimeout(() => { i++; i < 2 ? rodada() : terminar(); }, 2000);
    });
  }
  function terminar() {
    JogoKit.progresso.melhor(ID_PROG, acertos);
    app.innerHTML = '<tela-fim icone="🏥" titulo="Os serviços públicos" estrelas="' + acertos + '" total="2" resumo="Você acertou tudo!"></tela-fim>' + rodape;
  }
  rodada();
})();
</script>
</body>
</html>
