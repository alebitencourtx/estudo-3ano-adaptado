<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campo e cidade trocam — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  jogo-topo,barra-progresso,tela-fim{display:block}
  .alvo .ico.emoji{font-size:2.8rem;line-height:1}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Campo e cidade trocam (impactos ambientais, livro p. 108) =====
   O campo abastece a cidade com comida; a cidade abastece o campo com
   produtos da indústria. Regras TEA: 1 instrução, 2 destinos, frases curtas,
   sem cronômetro, erro sem punição (mostra a resposta certa e destaca o alvo).
   Ícones: Twemoji (CC-BY 4.0). Texto base: livro do 3º ano, p. 108. */

const ID = 'campo-cidade-imp';
const TOTAL = 6;

const ALVOS = [
  { id: 'campo',  ico: '🚜', nome: 'Vem do campo' },
  { id: 'cidade', ico: '🏙️', nome: 'Vem da cidade' }
];

const PECAS = [
  { id: 'leite',   alvo: 'campo',  ico: '../../img/jogo/imp/leite.svg',   nome: 'Leite',   msg: 'O campo manda leite para a cidade.' },
  { id: 'ovos',    alvo: 'campo',  ico: '../../img/jogo/imp/ovos.svg',    nome: 'Ovos',    msg: 'O campo manda ovos para a cidade.' },
  { id: 'carne',   alvo: 'campo',  ico: '../../img/jogo/imp/carne.svg',   nome: 'Carne',   msg: 'O campo manda carne para a cidade.' },
  { id: 'roupa',   alvo: 'cidade', ico: '../../img/jogo/imp/roupa.svg',   nome: 'Roupa',   msg: 'A cidade manda roupa para o campo.' },
  { id: 'remedio', alvo: 'cidade', ico: '../../img/jogo/imp/remedio.svg', nome: 'Remédio', msg: 'A cidade manda remédio para o campo.' },
  { id: 'celular', alvo: 'cidade', ico: '../../img/jogo/imp/celular.svg', nome: 'Celular', msg: 'A cidade manda celular para o campo.' }
];

const CREDITOS = [
  'Ícones de leite, ovos, carne, roupa, remédio e celular: Twemoji, CC-BY 4.0.',
  'Texto base: livro do 3º ano, p. 108 (o campo abastece a cidade e a cidade abastece o campo).'
];

const RODAPE = '<p class="rodape"><a href="../index.html">← Todos os jogos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
  + CREDITOS.map(c => '<li>' + JogoKit.esc(c) + '</li>').join('')
  + '</ul></details>';

const app = document.getElementById('app');
let S = null;                       /* { colocadas, primeiras } */

/* componentes web criados por innerHTML: garante que já renderizaram */
function montarComponentes() {
  app.querySelectorAll('jogo-topo,barra-progresso,tela-fim').forEach(el => {
    if (!el.firstElementChild && typeof el.connectedCallback === 'function') el.connectedCallback();
  });
}

function atualizar() {
  const cont = app.querySelector('jogo-topo [data-contador]');
  if (cont) cont.textContent = S.colocadas + '/' + TOTAL;
  const bar = app.querySelector('barra-progresso');
  if (bar) {
    if (!bar.querySelector('.bar') && typeof bar.render === 'function') bar.render();
    if (typeof bar.atualizar === 'function') bar.atualizar(S.colocadas, TOTAL);
  }
}

function diz(texto, ok) {
  const f = app.querySelector('#feed');
  if (!f) return;
  f.textContent = texto;
  f.className = 'feed ' + (ok ? 'ok' : 'bad');
}

function pulso(el) {
  el.classList.add('pulso');
  setTimeout(() => el.classList.remove('pulso'), 1400);
}

/* ---------- tela do jogo ---------- */
function renderJogo() {
  JogoKit.arrasto.limpar();
  S = { colocadas: 0, primeiras: 0 };
  const pecas = JogoKit.embaralhar(PECAS);

  app.innerHTML =
    '<jogo-topo icone="🚚" titulo="Campo e cidade trocam" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>'
    + '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>'
    + '<section class="card">'
      + '<p class="pergunta">De onde vem cada produto?</p>'
      + '<fala-botoes texto="O campo abastece a cidade com comida. A cidade abastece o campo com produtos da indústria."></fala-botoes>'
      + '<p class="hint">Arraste a peça para a caixa certa. Ou toque na peça e depois na caixa.</p>'
      + '<div class="alvos" id="alvos" style="margin-top:16px">'
        + ALVOS.map(a =>
            '<div class="alvo" data-id="' + a.id + '" role="button" tabindex="0" aria-label="' + JogoKit.esc(a.nome) + '">'
            + '<span class="ico emoji" aria-hidden="true">' + a.ico + '</span>'
            + '<span class="nome">' + JogoKit.esc(a.nome) + '</span>'
            + '<span class="encaixados"></span>'
          + '</div>').join('')
      + '</div>'
      + '<div class="bandeja" id="bandeja">'
        + pecas.map(p => JogoKit.pecaHtml(p)).join('')
      + '</div>'
      + '<p class="feed" id="feed" aria-live="polite"></p>'
    + '</section>'
    + RODAPE;

  montarComponentes();
  atualizar();

  const topo = app.querySelector('jogo-topo');
  if (topo) topo.addEventListener('voltar', () => { location.href = 'index.html'; });

  app.querySelectorAll('.peca').forEach(peca => JogoKit.arrasto.ligar(peca, soltar, falarNome));
  app.querySelectorAll('.alvo').forEach(alvo => JogoKit.arrasto.ligarAlvo(alvo, soltar));
  window.scrollTo(0, 0);
}

function falarNome(peca) {
  if (!peca) return;
  const n = peca.querySelector('.nome');
  if (n) JogoKit.falar(n.textContent, 0.85);
}

/* ---------- soltar a peça: certo ou errado ---------- */
function soltar(peca, alvo) {
  if (!peca || !alvo || peca.dataset.feita) return;
  const certo = peca.dataset.alvo === alvo.dataset.id;
  const tent = +peca.dataset.tent || 0;

  if (certo) {
    peca.dataset.feita = '1';
    if (tent === 0) S.primeiras++;
    peca.classList.add('encaixada');
    const caixa = alvo.querySelector('.encaixados');
    if (caixa) caixa.appendChild(peca);
    JogoKit.arrasto.limpar();
    S.colocadas++;
    diz('✓ ' + peca.dataset.msg, true);
    JogoKit.falar(peca.dataset.msg, 0.85);
    atualizar();
    if (S.colocadas === TOTAL) setTimeout(renderFim, 900);
  } else {
    peca.dataset.tent = tent + 1;
    diz('✗ ' + peca.dataset.msg, false);
    JogoKit.falar(peca.dataset.msg, 0.85);
    pulso(peca);
    /* a peça continua selecionada: é só tocar na caixa certa */
    const bom = app.querySelector('.alvo[data-id="' + peca.dataset.alvo + '"]');
    if (bom) {
      bom.classList.add('brilho');
      setTimeout(() => bom.classList.remove('brilho'), 2200);
    }
  }
}

/* ---------- tela final ---------- */
function renderFim() {
  JogoKit.arrasto.limpar();
  const a = S.primeiras, n = TOTAL;
  JogoKit.progresso.melhor(ID, a);
  const msg = a === n ? 'Você acertou tudo de primeira! Muito bem!'
    : (a === n - 1 ? 'Muito bem! Quase tudo de primeira.'
    : 'Você acertou ' + a + ' de ' + n + ' de primeira. Pode jogar de novo.');

  app.innerHTML =
    '<tela-fim icone="🚚" titulo="Campo e cidade trocam" estrelas="' + a + '" total="' + n + '"'
    + ' resumo="Tudo no lugar!" msg="' + JogoKit.esc(msg) + '"></tela-fim>'
    + RODAPE;

  montarComponentes();

  const tf = app.querySelector('tela-fim');
  if (tf) tf.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();
    else location.href = 'index.html';
  });

  JogoKit.falar('Tudo no lugar! Você acertou ' + a + ' de ' + n + ' de primeira.', 0.85);
  window.scrollTo(0, 0);
}

renderJogo();
</script>
</body>
</html>
