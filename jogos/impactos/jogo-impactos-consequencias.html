<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O que isso pode causar? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
.foto-apoio{width:100%;max-height:180px;object-fit:cover;border-radius:12px;border:2px solid var(--line);margin:0 0 10px}
.prox{margin-top:16px}
opcoes-resposta .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';
  const esc = JogoKit.esc;
  const ID_PROG = 'imp-consequencias';
  const TOTAL = 4;
  const RODADAS = [
    {
      pergunta: 'O desmatamento pode levar espécies à extinção?',
      certa: 'Sim',
      erradas: ['Não'],
      msg: 'O desmatamento leva espécies à extinção e empobrece o solo.',
      img: '../../img/hga/imp/desmatamento.jpg'
    },
    {
      pergunta: 'O lixo jogado nos rios deixa a água limpa?',
      certa: 'Não',
      erradas: ['Sim'],
      msg: 'O lixo na água causa poluição e aumenta as doenças.',
      img: '../../img/hga/imp/esgoto.jpg'
    },
    {
      pergunta: 'Usar agrotóxicos sem cuidado faz bem à saúde?',
      certa: 'Não',
      erradas: ['Sim'],
      msg: 'O agrotóxico contamina o solo e a água, e prejudica a saúde.',
      img: '../../img/hga/imp/agrotoxico.jpg'
    },
    {
      pergunta: 'Se usarmos água demais, pode faltar água para as pessoas?',
      certa: 'Sim',
      erradas: ['Não'],
      msg: 'O uso excessivo pode reduzir a água disponível para as pessoas.',
      img: '../../img/hga/imp/irrigacao.jpg'
    }
  ];
  const FECHAMENTO = 'O desmatamento também afeta o curso dos rios e o regime de chuvas.';
  const rodape = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
                 '<details class="detalhes"><summary>Créditos das imagens</summary><p>' + esc(FECHAMENTO) + '</p>' +
                 '<p>O uso frequente e inadequado de agrotóxicos pode prejudicar a saúde humana e animal.</p>' +
                 '<p>O uso excessivo de água pode reduzir a água disponível para o consumo das pessoas.</p>' +
                 '<p>O desmatamento é proibido em diversas localidades, mas ainda ocorre de forma irregular.</p></details>';

  const app = document.getElementById('app');
  let i = 0, acertos = 0;

  function rodada() {
    const r = RODADAS[i];
    let imgHtml = r.img ? '<img class="foto-apoio" src="' + esc(r.img) + '">' : '';
    app.innerHTML = '<jogo-topo icone="🐟" titulo="O que isso pode causar?" contador="' + (i + 1) + '/' + TOTAL + '"></jogo-topo>' +
                    '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
                    '<section class="card">' +
                    '<fala-botoes texto="Veja o que cada problema pode causar."></fala-botoes>' +
                    imgHtml +
                    '<fala-botoes texto="' + esc(r.pergunta) + '"></fala-botoes>' +
                    '<div data-quiz></div>' +
                    '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
                    '</section>' + rodape;
    const op = document.createElement('opcoes-resposta');
    op.montar({ pergunta: r.pergunta, opcoes: ['Sim', 'Não'], certa: r.certa, msg: r.msg });
    app.querySelector('[data-quiz]').appendChild(op);
    const prox = app.querySelector('[data-prox]');
    prox.onclick = () => { i + 1 < TOTAL ? (i++, rodada()) : terminar(); };
    op.addEventListener('resposta', function (e) {
      if (e.detail && e.detail.ok) acertos++;
      prox.classList.remove('escondido');
      JogoKit.falar((e.detail.ok ? '✓ ' : '✗ ') + r.msg, 0.85);
    });
  }
  function terminar() {
    JogoKit.progresso.melhor(ID_PROG, acertos);
    app.innerHTML = '<tela-fim icone="🐟" titulo="O que isso pode causar?" estrelas="' + acertos + '" total="' + TOTAL + '" resumo="Você respondeu tudo!"></tela-fim>' + rodape;
  }
  rodada();
})();
</script>
</body>
</html>
