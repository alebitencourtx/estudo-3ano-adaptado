<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perguntas do ambiente — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .apoio{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* ❓ Perguntas do ambiente — quiz de 4 rodadas, uma pergunta por tela.
     Base: livro p. 108 a 113. Vocabulário de resumos/imp-108-113.md.
     Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre aparece).
     Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio em cada rodada. */

  const app = document.getElementById('app');
  const ID = 'imp-perguntas';
  const TOTAL = 4;

  const RODADAS = [
    {
      pergunta: 'O que acontece quando máquinas fazem o trabalho no campo?',
      certa: 'Aumenta a produção e o desemprego',
      erradas: ['Usa muita água', 'Tira a vegetação natural'],
      msg: 'As máquinas substituem o trabalho das pessoas.',
      img: '../../img/hga/imp/colheitadeiras.jpg',
      alt: 'Colheitadeiras no campo'
    },
    {
      pergunta: 'A irrigação usa muita água ou pouca água?',
      certa: 'Usa muita água',
      erradas: ['Faz crescer o desemprego no campo', 'Empobrece o solo'],
      msg: 'A irrigação é uma das práticas que mais usam água.',
      img: '../../img/hga/imp/irrigacao.jpg',
      alt: 'Irrigação na plantação'
    },
    {
      pergunta: 'O engarrafamento piora qual problema?',
      certa: 'A poluição do ar',
      erradas: ['Aumenta o desemprego no campo', 'Contamina os córregos e rios'],
      msg: 'O engarrafamento agrava a poluição do ar.',
      img: '../../img/hga/imp/engarrafamento.jpg',
      alt: 'Carros no engarrafamento'
    },
    {
      pergunta: 'Morar na encosta do morro é morar em que tipo de área?',
      certa: 'É uma área de risco',
      erradas: ['Uma plantação de soja', 'Uma pastagem com gado'],
      msg: 'Encostas de morros são áreas de risco.',
      img: '../../img/hga/imp/morro.jpg',
      alt: 'Moradias na encosta do morro'
    }
  ];

  let i = 0;          // rodada da vez (0 a 3)
  let acertos = 0;    // acertos de primeira (a criança responde uma vez por rodada)

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 108 a 113 (uso escolar).</li>' +
      '<li>Perguntas com palavras do livro (p. 108 a 113).</li>' +
      '<li>Na agricultura, tratores e colheitadeiras aumentam a produção, mas substituem o trabalho das pessoas e fazem crescer o desemprego no campo.</li>' +
      '<li>O transporte coletivo deficiente aumenta o número de automóveis. Os congestionamentos dificultam o deslocamento e agravam a poluição do ar.</li>' +
      '<li>As moradias em áreas de risco ficam em encostas de morros e margens de rios e córregos.</li>' +
      '<li>Na agricultura, na pecuária e no extrativismo mineral usa-se muita água; a irrigação é uma das práticas que mais usam água.</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="❓" titulo="Perguntas do ambiente" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">Toque na resposta.</p>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o quiz em si é o componente do kit */
    const op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: r.pergunta,
      opcoes: JogoKit.embaralhar([r.certa].concat(r.erradas)),
      certa: r.certa,
      msg: r.msg
    });

    /* foto de apoio, quando houver: logo abaixo do enunciado e acima das opções */
    if (r.img) {
      const foto = document.createElement('img');
      foto.className = 'apoio';
      foto.src = r.img;
      foto.alt = r.alt || '';
      op.insertBefore(foto, op.querySelector('.opcoes'));
    }

    app.querySelector('[data-quiz]').appendChild(op);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="❓" titulo="Perguntas do ambiente" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
