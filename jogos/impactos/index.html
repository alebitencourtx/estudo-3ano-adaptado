<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Impactos ambientais — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
</head>
<body>
<main id="app"></main>
<script>
/* Pagina do topico "Impactos ambientais" — gerada por _espec/gerar_menus.py. */
const JOGOS = [
  {arquivo:'jogo-impactos-campo-cidade.html', icone:'🚚', nome:'Campo e cidade trocam', como:'Leve a peça à caixa certa', oque:'O campo manda comida, a cidade manda produtos.', id:'campo-cidade-imp'},
  {arquivo:'jogo-impactos-causas.html', icone:'⚠️', nome:'O problema e a causa', como:'Ligue o problema à causa', oque:'Desmatamento, agrotóxico, irrigação e esgoto.', id:'imp-causas'},
  {arquivo:'jogo-impactos-reciclagem.html', icone:'♻️', nome:'Cada lixo na sua lixeira', como:'Leve o lixo à lixeira certa', oque:'Papel azul, plástico vermelho, vidro verde, metal amarelo.', id:'imp-reciclagem'},
  {arquivo:'jogo-impactos-ajudar.html', icone:'💚', nome:'Ajudar a natureza', como:'Toque nas atitudes certas', oque:'O que ajuda a natureza e os problemas da cidade.', id:'imp-ajudar'},
  {arquivo:'jogo-impactos-perguntas.html', icone:'❓', nome:'Perguntas do ambiente', como:'Responda e veja a resposta', oque:'Mecanização, irrigação, engarrafamento e área de risco.', id:'imp-perguntas'},
  {arquivo:'jogo-impactos-servicos.html', icone:'🏥', nome:'Os serviços públicos', como:'Toque nos certos', oque:'Saúde, educação, coleta de lixo e segurança.', id:'imp-servicos'},
  {arquivo:'jogo-impactos-paisagem.html', icone:'🏞️', nome:'O que se vê na paisagem', como:'Responda e veja a resposta', oque:'Pastagem e soja, campo e cidade.', id:'imp-paisagem'},
  {arquivo:'jogo-impactos-consequencias.html', icone:'🐟', nome:'O que isso pode causar?', como:'Responda sim ou não', oque:'Extinção, doenças, saúde, água.', id:'imp-consequencias'},
];
const app = document.getElementById('app');
const prog = JogoKit.progresso.ler();
const legados = {};
['treino3ano.jogo.pec.v1', 'treino3ano.jogo.peca.v1'].forEach(function (k) {
  try { Object.keys(JSON.parse(localStorage.getItem(k) || '{}')).forEach(function (x) { legados[k + ':' + x] = 1; }); } catch (e) {}
});
function jogou(j) {
  if (j.id) return prog[j.id] !== undefined;
  if (j.legado) return Object.keys(legados).some(function (k) { return k.indexOf(j.legado + ':') === 0; });
  return false;
}
app.innerHTML = `
<header class="top">
  <h1><img class="fita" src="../../img/fita-autismo.png" alt=""> 🚚 Impactos ambientais</h1>
  <p class="sub">p. 108 a 113 · 8 jogos · base do livro</p>
  <p class="sub">O campo e a cidade trocam produtos, e os problemas do ambiente: desmatamento, água, lixo e trânsito.</p>
</header>
<section class="cards">
  ${JOGOS.map(j => `
  <article class="card fase">
    <span class="ico" aria-hidden="true">${j.icone}</span>
    <div class="txt">
      <h2>${JogoKit.esc(j.nome)}</h2>
      <p class="sub">${JogoKit.esc(j.como)}</p>
      <p class="sub">${JogoKit.esc(j.oque)}</p>
      ${jogou(j) ? '<p class="marca">✓ Você já jogou este.</p>' : ''}
    </div>
    <button type="button" class="btn jogar" data-ir="${JogoKit.esc(j.arquivo)}">Jogar</button>
  </article>`).join('')}
</section>
<p class="hint" style="text-align:center">Funciona no dedo (celular e tablet) e no mouse. Nenhum jogo tem cronômetro.</p>
<p class="rodape"><a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>
<details class="detalhes">
  <summary>Sobre estes jogos</summary>
  <ul>
    <li>Palavras e fatos só do livro (p. 108 a 113).</li>
    <li>Sem cronômetro. Se errar, a resposta certa aparece e você pode tentar de novo.</li>
    <li>Use 🔊 Ouvir e 🐢 Devagar para ouvir. Sem voz no aparelho, peça a um adulto para ler.</li>
  </ul>
</details>`;
app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { location.href = b.dataset.ir; });

</script>
</body>
</html>
