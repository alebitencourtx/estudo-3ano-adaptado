<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O problema e a causa — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>   <!-- clássico, no head: define os componentes antes do corpo -->
<style>
/* ===== ajustes locais do jogo "O problema e a causa" (não altera o jogo-kit.css) =====
   Regras TEA: toque grande, apoio visual (foto + frase), sem cronômetro, erro não trava nada. */
.ligar .opcao{cursor:pointer;min-height:64px;justify-content:center;font-size:1.05rem}
.ligar .opcao.palavra{padding:18px 12px}
.ligar .opcao.foto{padding:8px}
.ligar .opcao.foto img{width:100%;height:96px;object-fit:cover;border-radius:12px}
.ligar .opcao .causa{display:block;margin-top:8px;font-size:1rem; font-weight:700}
.ligar .opcao.pulso{animation:pulso .45s ease 3}
.ligar .opcao.brilho{animation:brilho .9s ease 2}
.ligar .opcao.palavra.feito{text-decoration:line-through}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== O problema e a causa — ligar problema do ambiente → causa (impactos, livro p. 110 a 113) =====
   Conteúdo do livro (listas fechadas em resumos/imp-108-113.md):
     desmatamento tira a vegetação natural · agrotóxico contamina o solo e a água ·
     irrigação usa muita água · esgoto sem tratamento contamina os córregos e rios.
   Regras TEA: 4 pares, uma instrução, 1 frase por causa, feedback imediato,
   erro mostra a frase do problema escolhido e destaca a causa certa (nada trava). */
(function () {
  'use strict';
  const esc = JogoKit.esc;

  const PROBLEMAS = [
    { id: 'desmatamento', palavra: 'Desmatamento',
      foto: '../../img/hga/imp/desmatamento.jpg', alt: 'Área com a vegetação retirada',
      causa: 'Tira a vegetação natural', msg: 'O desmatamento tira a vegetação natural.' },
    { id: 'agrotoxico', palavra: 'Agrotóxico',
      foto: '../../img/hga/imp/agrotoxico.jpg', alt: 'Agrotóxico aplicado na plantação',
      causa: 'Contamina o solo e a água', msg: 'O agrotóxico contamina o solo e a água.' },
    { id: 'irrigacao', palavra: 'Irrigação',
      foto: '../../img/hga/imp/irrigacao.jpg', alt: 'Água usada na irrigação da plantação',
      causa: 'Usa muita água', msg: 'A irrigação usa muita água.' },
    { id: 'esgoto', palavra: 'Esgoto sem tratamento',
      foto: '../../img/hga/imp/esgoto.jpg', alt: 'Esgoto caindo no rio',
      causa: 'Contamina os rios', msg: 'O esgoto sem tratamento contamina os córregos e rios.' }
  ];
  const TOTAL = PROBLEMAS.length;
  const APOIO = 'Ligue cada problema do ambiente à sua causa.';
  const DICA = 'Toque no problema e depois na causa.';
  const DICA_ANTES = 'Toque primeiro no problema.';

  const CREDITOS = [
    'Fotos de desmatamento, agrotóxico, irrigação e esgoto: livro de História e Geografia do 3º ano, p. 110 a 113 (uso escolar).',
    'Ícone ⚠️: Twemoji, CC-BY 4.0.'
  ];

  const app = document.getElementById('app');
  let sel = null;          /* problema (.opcao.palavra) selecionado */
  let S = null;            /* { feitos, primeiras, errou } */

  const dado = id => PROBLEMAS.filter(p => p.id === id)[0];

  /* ---------- telas ---------- */
  function renderJogo() {
    sel = null;
    S = { feitos: 0, primeiras: 0, errou: {} };
    const causas = JogoKit.embaralhar(PROBLEMAS);   /* causas embaralhadas a cada rodada */

    app.innerHTML =
      '<jogo-topo icone="⚠️" titulo="O problema e a causa" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<p class="pergunta">Qual é a causa de cada problema?</p>' +
        '<fala-botoes texto="' + esc(APOIO) + '"></fala-botoes>' +
        '<p class="hint">' + esc(DICA) + '</p>' +
        '<div class="ligar">' +
          '<div class="coluna">' +
            PROBLEMAS.map(p =>
              '<div class="opcao palavra" data-id="' + p.id + '" role="button" tabindex="0" ' +
                'aria-label="Problema: ' + esc(p.palavra) + '">' + esc(p.palavra) + '</div>').join('') +
          '</div>' +
          '<div class="coluna">' +
            causas.map(p =>
              '<div class="opcao foto" data-id="' + p.id + '" data-msg="' + esc(p.msg) + '" role="button" tabindex="0" ' +
                'aria-label="Causa: ' + esc(p.causa) + '"><img src="' + esc(p.foto) + '" alt="">' +
                '<span class="causa">' + esc(p.causa) + '</span></div>').join('') +
          '</div>' +
        '</div>' +
        '<p class="feed" id="feed" aria-live="polite"></p>' +
      '</section>' +
      '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
        CREDITOS.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' +
        '<p>Agrotóxicos servem para prevenir ou eliminar pragas. O uso frequente e inadequado pode prejudicar a saúde humana e animal.</p>' +
        '<p>A agricultura, a pecuária e o extrativismo mineral usam muita água.</p>' +
        '<p>O desmatamento também empobrece o solo e afeta os rios e as chuvas.</p></details>';

    app.querySelectorAll('.opcao.palavra').forEach(el => {
      el.addEventListener('click', () => tocarProblema(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarProblema(el); } });
    });
    app.querySelectorAll('.opcao.foto').forEach(el => {
      el.addEventListener('click', () => tocarCausa(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarCausa(el); } });
    });

    atualizar();
    window.scrollTo(0, 0);
  }

  /* ---------- toques ---------- */
  function tocarProblema(el) {
    if (el.classList.contains('feito')) return;
    if (sel === el) { el.classList.remove('sel'); sel = null; return; }
    if (sel) sel.classList.remove('sel');
    sel = el;
    el.classList.add('sel');
    JogoKit.falar(el.textContent.trim(), 0.85);
  }

  function tocarCausa(el) {
    if (el.classList.contains('feito')) return;
    if (!sel) { diz(DICA_ANTES, false); return; }

    const idProblema = sel.dataset.id;
    const p = dado(idProblema);

    if (idProblema === el.dataset.id) {
      /* acerto: os dois lados ficam .feito (✓) e aparece a frase */
      el.classList.add('feito');
      sel.classList.add('feito');
      sel.classList.remove('sel');
      sel = null;
      S.feitos++;
      if (!S.errou[idProblema]) S.primeiras++;
      diz('✓ ' + p.msg, true);
      JogoKit.falar(p.msg, 0.85);
      atualizar();
      if (S.feitos === TOTAL) setTimeout(renderFim, 900);
    } else {
      /* erro: mostra a frase do problema escolhido e destaca a causa certa.
         O problema continua selecionado — é só tocar na causa certa. */
      S.errou[idProblema] = true;
      diz('✗ Não é essa. ' + p.msg, false);
      JogoKit.falar(p.msg, 0.85);
      const certa = app.querySelector('.opcao.foto[data-id="' + idProblema + '"]');
      if (certa) {
        certa.classList.add('brilho');
        setTimeout(() => certa.classList.remove('brilho'), 1900);
      }
    }
  }

  /* ---------- apoio ---------- */
  function atualizar() {
    const bar = app.querySelector('barra-progresso');
    if (bar && bar.atualizar) bar.atualizar(S.feitos, TOTAL);
    const topo = app.querySelector('jogo-topo');
    if (topo) {
      const txt = S.feitos + '/' + TOTAL;
      topo.contador = txt;                 /* o componente troca o texto visível */
      topo.setAttribute('contador', txt);  /* e o atributo acompanha o estado */
    }
  }

  function diz(txt, ok) {
    const f = document.getElementById('feed');
    if (!f) return;
    f.textContent = txt;
    f.className = 'feed ' + (ok ? 'ok' : 'bad');
  }

  function ir(url) { try { location.href = url; } catch (e) {} }

  /* ---------- fim ---------- */
  function renderFim() {
    const n = S.primeiras;
    JogoKit.progresso.melhor('imp-causas', n);
    const msg = n === TOTAL ? 'Você acertou tudo de primeira!'
      : n >= TOTAL - 1 ? 'Muito bem! Quase tudo de primeira.'
      : 'Você acertou ' + n + ' de ' + TOTAL + ' de primeira. Pode jogar de novo.';

    app.innerHTML =
      '<tela-fim icone="⚠️" titulo="O problema e a causa" estrelas="' + n + '" total="' + TOTAL + '" ' +
        'resumo="Você ligou tudo!" msg="' + esc(msg) + '"></tela-fim>' +
      '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
        CREDITOS.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></details>';

    JogoKit.falar('Você ligou tudo! ' + n + ' de ' + TOTAL + ' de primeira.', 0.85);
    window.scrollTo(0, 0);
  }

  /* eventos dos componentes (valem para todas as telas) */
  document.addEventListener('voltar', () => ir('index.html'));
  document.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();   /* reinicia embaralhando as causas */
    else ir('index.html');
  });

  renderJogo();
})();
</script>
</body>
</html>
