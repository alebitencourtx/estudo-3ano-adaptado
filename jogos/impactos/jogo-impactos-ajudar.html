<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ajudar a natureza — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .prox{margin-top:16px}
  fichas-toque .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 💚 Ajudar a natureza — impactos ambientais, 2 rodadas de "toque nos certos".
     Base: livro p. 108 a 113. Vocabulário de resumos/imp-108-113.md.
     Componente do kit: <fichas-toque> (toca para marcar, "Conferir" revela ✓/✗
     e a resposta certa sempre aparece).
     Regras TEA: frases curtas, sem cronômetro, áudio do enunciado em cada rodada,
     "Conferir" só libera com o número certo de fichas marcadas. */

  const app = document.getElementById('app');
  const ID = 'imp-ajudar';
  const TOTAL = 2;

  /* ícones das fichas (opcional): só entram os que existem em ../../img/jogo/imp/ */
  const ICONES = {
    'Separar o lixo reciclável': '../../img/jogo/imp/sacola.svg',
    'Fechar a torneira': '../../img/jogo/imp/torneira.svg',
    'Plantar árvores': '../../img/jogo/imp/arvore.svg',
    'Jogar óleo na pia': '../../img/jogo/imp/oleo.svg',
    'Queimar lixo': '../../img/jogo/imp/lixo.svg',
    'Deixar a luz acesa': '../../img/jogo/imp/lampada.svg'
  };

  const RODADAS = [
    {
      pergunta: 'Toque nas 3 atitudes que ajudam a natureza.',
      hint: 'Toque em 3 fichas e depois em Conferir.',
      certas: ['Separar o lixo reciclável', 'Fechar a torneira', 'Plantar árvores'],
      distratores: ['Jogar óleo na pia', 'Queimar lixo', 'Deixar a luz acesa'],
      msg: 'Essas atitudes ajudam a natureza.'
    },
    {
      pergunta: 'Toque nos 2 problemas da cidade.',
      hint: 'Toque em 2 fichas e depois em Conferir.',
      certas: ['Esgoto sem tratamento', 'Moradia em área de risco'],
      distratores: ['Plantar árvores', 'Coleta seletiva'],
      msg: 'Esgoto e moradia em área de risco são problemas da cidade.'
    }
  ];

  let i = 0;          // rodada da vez (0 ou 1)
  let acertos = 0;    // rodadas certas de primeira

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Os 5 jogos</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 108 a 113 (uso escolar).</li>' +
      '<li>Palavras do livro (p. 108 a 113): separar o lixo reciclável, fechar a torneira, plantar árvores, esgoto sem tratamento, moradia em área de risco, coleta seletiva.</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* monta as fichas da rodada: as certas + os distratores, embaralhadas */
  function fichasDa(r) {
    return JogoKit.embaralhar(r.certas.concat(r.distratores)).map(function (nome) {
      return ICONES[nome] ? { nome: nome, ico: ICONES[nome] } : nome;
    });
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="💚" titulo="Ajudar a natureza" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint" data-dica>' + JogoKit.esc(r.hint) + '</p>' +
        '<div data-toque></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o "toque nos certos" é o componente do kit */
    const ft = document.createElement('fichas-toque');
    ft.montar({
      pergunta: r.pergunta,
      fichas: fichasDa(r),
      certas: r.certas,
      msg: r.msg
    });
    app.querySelector('[data-toque]').appendChild(ft);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    ft.addEventListener('conferido', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ Os certos são: ' + r.certas.join(', ') + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="💚" titulo="Ajudar a natureza" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você cuidou da natureza!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
