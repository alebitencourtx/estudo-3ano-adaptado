<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Do metal ao objeto — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>   <!-- clássico, no head: define os componentes antes do corpo -->
<style>
  /* ===== ajustes locais do jogo "Do metal ao objeto" (não altera o jogo-kit.css) ===== */
  jogo-topo,barra-progresso,tela-fim{display:block}
  .alvo .encaixados{min-height:60px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .alvo .foto{width:100%;max-height:130px;object-fit:cover;border-radius:14px;border:2px solid var(--line)}
  .peca .nome{max-width:170px;line-height:1.2}
  .peca.texto{min-height:96px;justify-content:center;text-align:center}
  .dica{margin-top:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Do metal ao objeto (extrativismo mineral, livro p. 90, 91) =====
   Classificar os objetos em caixas de metal: cobre, ferro e alumínio.
   Duas rodadas de 4 e 3 cartões (poucos cartões por tela), contador X/7.
   Dois modos: arrastar (dedo/mouse) e tocar (toca no cartão e depois na caixa).
   Regras TEA: 1 instrução, frases curtas, sem cronômetro, erro sem punição
   (mostra a frase certa e destaca a caixa certa; o cartão continua selecionado).
   Vocabulário de resumos/min-90-91.md e _espec/mineral.md:
     cobre → fios elétricos e utensílios domésticos;
     ferro → ferramentas e automóveis;
     bauxita → alumínio → utensílios de cozinha, bicicletas, partes de aviões.
   Caixas: fotos do livro (cobre, ferro e alumínio). Ícones: Twemoji (CC-BY 4.0). */

const ID = 'min-objetos';
const TOTAL = 7;

/* caixas (.alvo): a foto do livro do metal + nome */
const ALVOS = [
  { id: 'cobre',    foto: '../../img/hga/min/cobre.jpg',    nome: 'Cobre' },
  { id: 'ferro',    foto: '../../img/hga/min/ferro.jpg',    nome: 'Ferro' },
  { id: 'aluminio', foto: '../../img/hga/min/aluminio.jpg', nome: 'Alumínio (da bauxita)' }
];

/* cartões (.peca): ícone quando existe um que represente o objeto;
   sem ícone (= texto puro) nos outros, para o desenho não entregar a resposta de outra caixa */
const PECAS = [
  { id: 'fios',       alvo: 'cobre',    ico: '../../img/jogo/min/energia.svg',     nome: 'Fios elétricos',        msg: 'O cobre faz fios elétricos.' },
  { id: 'domesticos', alvo: 'cobre',    ico: '',                                   nome: 'Utensílios domésticos', msg: 'O cobre faz utensílios domésticos.' },
  { id: 'ferramentas', alvo: 'ferro',   ico: '../../img/jogo/min/ferramentas.svg', nome: 'Ferramentas',           msg: 'O ferro faz ferramentas.' },
  { id: 'automoveis', alvo: 'ferro',    ico: '',                                   nome: 'Automóveis',            msg: 'O ferro faz automóveis.' },
  { id: 'cozinha',    alvo: 'aluminio', ico: '../../img/jogo/min/cozinha.svg',     nome: 'Utensílios de cozinha', msg: 'O alumínio faz utensílios de cozinha.' },
  { id: 'bicicletas', alvo: 'aluminio', ico: '../../img/jogo/min/bicicleta.svg',   nome: 'Bicicletas',            msg: 'O alumínio faz bicicletas.' },
  { id: 'avioes',     alvo: 'aluminio', ico: '../../img/jogo/min/aviao.svg',       nome: 'Partes de aviões',      msg: 'O alumínio faz partes de aviões.' }
];

/* 2 rodadas: cobre + ferro e, depois, o alumínio (as duas famílias de utensílios não se misturam) */
const RODADAS = [
  { nome: 'Rodada 1', pecas: ['fios', 'domesticos', 'ferramentas', 'automoveis'] },
  { nome: 'Rodada 2', pecas: ['cozinha', 'bicicletas', 'avioes'] }
];

const PERGUNTA = 'Qual metal é usado para fazer cada objeto?';
const HINT = 'Arraste um objeto até o metal. Ou toque no objeto e depois no metal.';
const LEMBRETE = 'O alumínio vem da bauxita. O ferro, com outros elementos e altas temperaturas, vira aço. O ferro também é usado em máquinas e eletrodomésticos.';

const CREDITOS = [
  'Fotos do livro didático, p. 90 e 91 (uso escolar): cobre, ferro e alumínio.',
  'Ícones: Twemoji, CC-BY 4.0.',
  'Texto base: livro do 3º ano, p. 90 e 91 (os minerais viram produtos de uso cotidiano).'
];

const RODAPE = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary>'
  + '<ul>' + CREDITOS.map(c => '<li>' + JogoKit.esc(c) + '</li>').join('') + '</ul>'
  + '</details>';

const app = document.getElementById('app');
let S = null;                       /* { colocadas, primeiras, rodada } */

const pecaDe = id => PECAS.filter(p => p.id === id)[0];

/* cartão do objeto: com ícone (pecaHtml do kit) ou texto puro */
function cardHtml(p) {
  if (p.ico) return JogoKit.pecaHtml({ id: p.id, alvo: p.alvo, ico: p.ico, nome: p.nome, msg: p.msg });
  return '<div class="peca texto" data-id="' + JogoKit.esc(p.id) + '" data-alvo="' + JogoKit.esc(p.alvo) + '"' +
    ' data-msg="' + JogoKit.esc(p.msg) + '" data-tent="0" role="button" tabindex="0"' +
    ' aria-label="' + JogoKit.esc(p.nome) + '"><span class="nome">' + JogoKit.esc(p.nome) + '</span></div>';
}

function atualizar() {
  const topo = app.querySelector('jogo-topo');
  if (topo) topo.contador = S.colocadas + '/' + TOTAL;
  const bar = app.querySelector('barra-progresso');
  if (bar && bar.atualizar) bar.atualizar(S.colocadas, TOTAL);
}

function diz(texto, ok) {
  const f = app.querySelector('#feed');
  if (!f) return;
  f.textContent = texto;
  f.className = 'feed ' + (ok ? 'ok' : 'bad');
}

function pulso(el) {
  el.classList.add('pulso');
  setTimeout(() => el.classList.remove('pulso'), 1400);
}

function ligarCartoes() {
  app.querySelectorAll('#bandeja .peca').forEach(peca => JogoKit.arrasto.ligar(peca, soltar, falarNome));
}

/* ---------- tela do jogo (rodada 1) ---------- */
function renderJogo() {
  JogoKit.arrasto.limpar();
  S = { colocadas: 0, primeiras: 0, rodada: 0 };

  app.innerHTML =
    '<jogo-topo icone="🍳" titulo="Do metal ao objeto" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>'
    + '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>'
    + '<section class="card">'
      + '<p class="pergunta">' + JogoKit.esc(PERGUNTA) + '</p>'
      + '<fala-botoes texto="' + JogoKit.esc(PERGUNTA) + '"></fala-botoes>'
      + '<p class="hint">' + JogoKit.esc(HINT) + '</p>'
      + '<div class="alvos" id="alvos" style="margin-top:16px">'
        + ALVOS.map(a =>
            '<div class="alvo" data-id="' + a.id + '" role="button" tabindex="0" aria-label="Metal ' + JogoKit.esc(a.nome) + '">'
            + '<img class="foto" src="' + JogoKit.esc(a.foto) + '" alt="">'
            + '<span class="nome">' + JogoKit.esc(a.nome) + '</span>'
            + '<span class="encaixados"></span>'
          + '</div>').join('')
      + '</div>'
      + '<div class="bandeja" id="bandeja">'
        + RODADAS[0].pecas.map(id => cardHtml(pecaDe(id))).join('')
      + '</div>'
      + '<p class="feed" id="feed" aria-live="polite"></p>'
      + '<details class="detalhes dica"><summary>Ver dica</summary><p>' + JogoKit.esc(LEMBRETE) + '</p></details>'
    + '</section>'
    + RODAPE;

  atualizar();

  const topo = app.querySelector('jogo-topo');
  if (topo) topo.addEventListener('voltar', () => { location.href = 'index.html'; });

  ligarCartoes();
  app.querySelectorAll('.alvo').forEach(alvo => JogoKit.arrasto.ligarAlvo(alvo, soltar));
  window.scrollTo(0, 0);
}

/* ---------- troca de rodada: as caixas ficam, os cartões mudam ---------- */
function proximaRodada() {
  S.rodada++;
  const r = RODADAS[S.rodada];
  if (!r) { renderFim(); return; }
  JogoKit.arrasto.limpar();
  const bandeja = app.querySelector('#bandeja');
  if (bandeja) bandeja.innerHTML = r.pecas.map(id => cardHtml(pecaDe(id))).join('');
  const f = app.querySelector('#feed');
  if (f) { f.textContent = ''; f.className = 'feed'; }
  ligarCartoes();
  atualizar();
  window.scrollTo(0, 0);
}

function falarNome(peca) {
  if (!peca) return;
  const n = peca.querySelector('.nome');
  if (n) JogoKit.falar(n.textContent, 0.85);
}

/* ---------- soltar o objeto: certo ou errado ---------- */
function soltar(peca, alvo) {
  if (!peca || !alvo || peca.dataset.feita) return;
  const certo = peca.dataset.alvo === alvo.dataset.id;
  const tent = +peca.dataset.tent || 0;

  if (certo) {
    peca.dataset.feita = '1';
    if (tent === 0) S.primeiras++;
    peca.classList.add('encaixada');
    const caixa = alvo.querySelector('.encaixados');
    if (caixa) caixa.appendChild(peca);
    JogoKit.arrasto.limpar();
    S.colocadas++;
    diz('✓ ' + peca.dataset.msg, true);
    JogoKit.falar(peca.dataset.msg, 0.85);
    atualizar();
    if (S.colocadas >= TOTAL) setTimeout(renderFim, 900);
    else if (!app.querySelector('#bandeja .peca')) setTimeout(proximaRodada, 900);
  } else {
    peca.dataset.tent = tent + 1;
    diz('✗ ' + peca.dataset.msg, false);
    JogoKit.falar(peca.dataset.msg, 0.85);
    pulso(peca);
    /* o cartão continua selecionado: é só tocar na caixa certa */
    const bom = app.querySelector('.alvo[data-id="' + peca.dataset.alvo + '"]');
    if (bom) {
      bom.classList.add('brilho');
      setTimeout(() => bom.classList.remove('brilho'), 2200);
    }
  }
}

/* ---------- tela final ---------- */
function renderFim() {
  if (!S) return;
  if (app.querySelector('tela-fim')) return;      /* já está na tela final */
  JogoKit.arrasto.limpar();
  const a = S.primeiras, n = TOTAL;
  JogoKit.progresso.melhor(ID, a);
  const msg = a === n ? 'Você acertou tudo de primeira!'
    : (a === n - 1 ? 'Muito bem! Quase tudo de primeira.'
    : 'Você acertou ' + a + ' de ' + n + '. Jogue de novo.');

  app.innerHTML =
    '<tela-fim icone="🍳" titulo="Do metal ao objeto" estrelas="' + a + '" total="' + n + '"'
    + ' resumo="Tudo no lugar!" msg="' + JogoKit.esc(msg) + '"></tela-fim>'
    + RODAPE;

  const tf = app.querySelector('tela-fim');
  if (tf) tf.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();
    else location.href = 'index.html';
  });

  JogoKit.falar('Tudo no lugar! Você acertou ' + a + ' de ' + n + ' de primeira.', 0.85);
  window.scrollTo(0, 0);
}

renderJogo();
</script>
</body>
</html>
