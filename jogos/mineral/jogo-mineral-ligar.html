<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De onde vem? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>   <!-- clássico, no head: define os componentes antes do corpo -->
<style>
/* ===== ajustes locais do jogo "De onde vem?" (não altera o jogo-kit.css) =====
   Regras TEA: toque grande, apoio visual, sem cronômetro, erro não trava nada. */
.ligar .opcao{cursor:pointer;min-height:64px;justify-content:center;font-size:1.05rem}
.ligar .opcao.palavra{padding:18px 12px}
.ligar .opcao.foto{padding:8px;flex-direction:column;gap:6px}
.ligar .opcao.foto img{width:100%;height:96px;object-fit:cover;border-radius:12px}
.ligar .opcao.foto .nome{font-weight:800;font-size:.95rem;text-align:center;line-height:1.2}
.ligar .opcao.foto .nota{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.2}
.ligar .opcao.pulso{animation:pulso .45s ease 3}
.ligar .opcao.brilho{animation:brilho .9s ease 2}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== De onde vem? — ligar palavra → foto (extrativismo mineral, p. 90, 91) =====
   Conteúdo do livro (listas fechadas em resumos/min-90-91.md):
     cobre → fios elétricos · ferro → portões e ferramentas (com altas temperaturas vira aço)
     calcário → cimento · bauxita → alumínio.
   Regras TEA: 4 pares, uma instrução, feedback imediato com a frase certa,
   erro aponta a foto certa e a criança tenta de novo (nada trava). */
(function () {
  'use strict';
  const esc = JogoKit.esc;

  const MINERAIS = [
    { id: 'cobre',    palavra: 'Cobre',    foto: '../../img/hga/min/cobre.jpg',
      alt: 'Fios de cobre',        nome: 'Fios de cobre',        nota: '',
      msg: 'Do cobre vêm os fios elétricos.' },
    { id: 'ferro',    palavra: 'Ferro',    foto: '../../img/hga/min/ferro.jpg',
      alt: 'Portão de ferro',      nome: 'Portão de ferro',      nota: '',
      msg: 'Do ferro vêm portões e ferramentas.' },
    { id: 'calcario', palavra: 'Calcário', foto: '../../img/hga/min/cimento.jpg',
      alt: 'Sacos de cimento',     nome: 'Sacos de cimento',     nota: '',
      msg: 'Do calcário vem o cimento.' },
    { id: 'bauxita',  palavra: 'Bauxita',  foto: '../../img/hga/min/aluminio.jpg',
      alt: 'Leiteira de alumínio', nome: 'Leiteira de alumínio', nota: 'Objeto de alumínio (vem da bauxita)',
      msg: 'Da bauxita vem o alumínio.' }
  ];
  const TOTAL = MINERAIS.length;
  const APOIO = 'Os minerais saem da natureza e viram produtos.';
  const FALA = 'Ligue cada mineral ao produto que ele ajuda a fazer.';
  const DICA = 'Arraste um mineral até o produto. Ou toque no mineral e depois no produto.';

  const CREDITOS = [
    'Fotos do livro de História e Geografia do 3º ano, p. 90 e 91 (uso escolar).',
    'Fios de cobre, portão de ferro, sacos de cimento e leiteira de alumínio.'
  ];

  const RODAPE = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
    + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
    + CREDITOS.map(c => '<li>' + esc(c) + '</li>').join('')
    + '</ul><p>O ferro, com outros elementos e altas temperaturas, vira aço.</p></details>';

  const app = document.getElementById('app');
  let sel = null;          /* palavra (.opcao.palavra) selecionada */
  let S = null;            /* { feitos, primeiras, errou } */

  const dado = id => MINERAIS.filter(m => m.id === id)[0];

  /* ---------- telas ---------- */
  function renderJogo() {
    sel = null;
    S = { feitos: 0, primeiras: 0, errou: {} };
    const fotos = JogoKit.embaralhar(MINERAIS);   /* fotos embaralhadas a cada rodada */

    app.innerHTML =
      '<jogo-topo icone="⛏️" titulo="De onde vem?" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<p class="pergunta">Ligue cada mineral ao produto que ele ajuda a fazer.</p>' +
        '<fala-botoes texto="' + esc(FALA) + '"></fala-botoes>' +
        '<p class="hint">' + esc(DICA) + '</p>' +
        '<p class="hint">' + esc(APOIO) + '</p>' +
        '<div class="ligar">' +
          '<div class="coluna">' +
            MINERAIS.map(m =>
              '<div class="opcao palavra" data-min="' + m.id + '" role="button" tabindex="0" ' +
                'aria-label="Palavra ' + esc(m.palavra) + '">' + esc(m.palavra) + '</div>').join('') +
          '</div>' +
          '<div class="coluna">' +
            fotos.map(m =>
              '<div class="opcao foto" data-id="' + m.id + '" data-msg="' + esc(m.msg) + '" role="button" tabindex="0" ' +
                'aria-label="' + esc(m.alt) + '">' +
                '<img src="' + esc(m.foto) + '" alt="">' +
                '<span class="nome">' + esc(m.nome) + '</span>' +
                (m.nota ? '<span class="nota">' + esc(m.nota) + '</span>' : '') +
              '</div>').join('') +
          '</div>' +
        '</div>' +
        '<p class="feed" id="feed" aria-live="polite"></p>' +
      '</section>' +
      RODAPE;

    app.querySelectorAll('.opcao.palavra').forEach(el => {
      el.addEventListener('click', () => tocarPalavra(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarPalavra(el); } });
    });
    app.querySelectorAll('.opcao.foto').forEach(el => {
      el.addEventListener('click', () => tocarFoto(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarFoto(el); } });
    });

    const topo = app.querySelector('jogo-topo');
    if (topo) topo.contador = '0/' + TOTAL;
    window.scrollTo(0, 0);
  }

  /* ---------- toques ---------- */
  function tocarPalavra(el) {
    if (el.classList.contains('feito')) return;
    if (sel === el) { el.classList.remove('sel'); sel = null; return; }
    if (sel) sel.classList.remove('sel');
    sel = el;
    el.classList.add('sel');
    JogoKit.falar(el.textContent.trim(), 0.85);
  }

  function tocarFoto(el) {
    if (el.classList.contains('feito')) return;
    if (!sel) { diz(DICA, true); JogoKit.falar(DICA, 0.85); return; }

    const idPalavra = sel.dataset.min;
    const d = dado(idPalavra);

    if (idPalavra === el.dataset.id) {
      /* acerto: as duas ficam .feito (✓) e aparece a frase */
      el.classList.add('feito');
      sel.classList.add('feito');
      sel.classList.remove('sel');
      sel = null;
      S.feitos++;
      if (!S.errou[idPalavra]) S.primeiras++;
      diz('✓ ' + d.msg, true);
      JogoKit.falar(d.msg, 0.85);
      atualizar();
      if (S.feitos === TOTAL) setTimeout(renderFim, 900);
    } else {
      /* erro: mostra a frase do mineral escolhido e destaca a foto certa.
         A palavra continua selecionada — é só tocar na foto certa. */
      S.errou[idPalavra] = true;
      diz('✗ Tente outra foto. ' + d.msg, false);
      JogoKit.falar(d.msg, 0.85);
      const certa = app.querySelector('.opcao.foto[data-id="' + idPalavra + '"]');
      if (certa) {
        certa.classList.add('brilho');
        setTimeout(() => certa.classList.remove('brilho'), 1900);
      }
    }
  }

  /* ---------- apoio ---------- */
  function atualizar() {
    const bar = app.querySelector('barra-progresso');
    if (bar && bar.atualizar) bar.atualizar(S.feitos, TOTAL);
    const topo = app.querySelector('jogo-topo');
    if (topo) {
      const txt = S.feitos + '/' + TOTAL;
      topo.contador = txt;                 /* o componente troca o texto visível */
      topo.setAttribute('contador', txt);  /* e o atributo acompanha o estado */
    }
  }

  function diz(txt, ok) {
    const f = document.getElementById('feed');
    if (!f) return;
    f.textContent = txt;
    f.className = 'feed ' + (ok ? 'ok' : 'bad');
  }

  function ir(url) { try { location.href = url; } catch (e) {} }

  /* ---------- fim ---------- */
  function renderFim() {
    const n = S.primeiras;
    JogoKit.progresso.melhor('ligar-min', n);
    const msg = n === TOTAL ? 'Você acertou tudo de primeira!'
      : n === TOTAL - 1 ? 'Muito bem! Quase tudo de primeira.'
      : 'Você acertou ' + n + ' de ' + TOTAL + '. Jogue de novo.';

    app.innerHTML =
      '<tela-fim icone="⛏️" titulo="De onde vem?" estrelas="' + n + '" total="' + TOTAL + '" ' +
        'resumo="Você ligou tudo!" msg="' + esc(msg) + '"></tela-fim>' +
      RODAPE;

    JogoKit.falar('Você ligou tudo! ' + n + ' de ' + TOTAL + ' de primeira.', 0.85);
    window.scrollTo(0, 0);
  }

  /* eventos dos componentes (valem para todas as telas) */
  document.addEventListener('voltar', () => ir('index.html'));
  document.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();   /* reinicia embaralhando as fotos */
    else ir('index.html');
  });

  renderJogo();
})();
</script>
</body>
</html>
