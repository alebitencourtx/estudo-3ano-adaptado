<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Extrativismo mineral — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
</head>
<body>
<main id="app"></main>
<script>
/* Pagina do topico "Extrativismo mineral" — gerada por _espec/gerar_menus.py. */
const JOGOS = [
  {arquivo:'../jogar.html?jogo=ligar-min', icone:'⛏️', nome:'De onde vem?', como:'Ligue o mineral ao produto', oque:'Cobre nos fios, ferro no aço, calcário no cimento.', id:'ligar-min'},
  {arquivo:'../jogar.html?jogo=mem-min', icone:'⛏️', nome:'Memória dos minerais', como:'Encontre as duas iguais', oque:'Fios de cobre, portão de ferro e sacos de cimento.', id:'mem-min'},
  {arquivo:'../jogar.html?jogo=min-perguntas', icone:'🔩', nome:'Para que serve?', como:'Responda e veja a resposta', oque:'Fios, aço, alumínio, cimento e areia.', id:'min-perguntas'},
  {arquivo:'../jogar.html?jogo=min-natureza', icone:'🌎', nome:'Da natureza ao produto', como:'Ponha na ordem certa', oque:'Milhões de anos, extração, e o produto no nosso dia.', id:'min-natureza'},
  {arquivo:'../jogar.html?jogo=min-toque', icone:'👆', nome:'Toque nos certos', como:'Toque nos certos', oque:'O que é feito de cobre e o que é feito de ferro.', id:'min-toque'},
  {arquivo:'../jogar.html?jogo=min-objetos', icone:'🍳', nome:'Do metal ao objeto', como:'Leve o cartão à caixa certa', oque:'Cobre, ferro e alumínio.', id:'min-objetos'},
  {arquivo:'../jogar.html?jogo=min-qual', icone:'🔍', nome:'Qual é este material?', como:'Olhe a foto e responda', oque:'Cobre, ferro, areia, alumínio e cimento.', id:'min-qual'},
];
const app = document.getElementById('app');
const prog = JogoKit.progresso.ler();
const legados = {};
['treino3ano.jogo.pec.v1', 'treino3ano.jogo.peca.v1'].forEach(function (k) {
  try { Object.keys(JSON.parse(localStorage.getItem(k) || '{}')).forEach(function (x) { legados[k + ':' + x] = 1; }); } catch (e) {}
});
function jogou(j) {
  if (j.id) return prog[j.id] !== undefined;
  if (j.legado) return Object.keys(legados).some(function (k) { return k.indexOf(j.legado + ':') === 0; });
  return false;
}
app.innerHTML = `
<header class="top">
  <h1><img class="fita" src="../../img/fita-autismo.png" alt=""> ⛏️ Extrativismo mineral</h1>
  <p class="sub">p. 90, 91 · 7 jogos · base do livro</p>
  <p class="sub">Os minerais saem da natureza e viram produtos: cobre, ferro, bauxita, areia e calcário.</p>
</header>
<section class="cards">
  ${JOGOS.map(j => `
  <article class="card fase">
    <span class="ico" aria-hidden="true">${j.icone}</span>
    <div class="txt">
      <h2>${JogoKit.esc(j.nome)}</h2>
      <p class="sub">${JogoKit.esc(j.como)}</p>
      <p class="sub">${JogoKit.esc(j.oque)}</p>
      ${jogou(j) ? '<p class="marca">✓ Você já jogou este.</p>' : ''}
    </div>
    <button type="button" class="btn jogar" data-ir="${JogoKit.esc(j.arquivo)}">Jogar</button>
  </article>`).join('')}
</section>
<p class="hint" style="text-align:center">Funciona no dedo (celular e tablet) e no mouse. Nenhum jogo tem cronômetro.</p>
<p class="rodape"><a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>
<details class="detalhes">
  <summary>Sobre estes jogos</summary>
  <ul>
    <li>Palavras e fatos só do livro (p. 90, 91).</li>
    <li>Sem cronômetro. Se errar, a resposta certa aparece e você pode tentar de novo.</li>
    <li>Use 🔊 Ouvir e 🐢 Devagar para ouvir. Sem voz no aparelho, peça a um adulto para ler.</li>
  </ul>
</details>`;
app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { location.href = b.dataset.ir; });

</script>
</body>
</html>
