<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qual é este material? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .foto-material{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 🔍 Qual é este material? — quiz com FOTO, 5 rodadas, uma pergunta por tela.
     Base: livro p. 91 (tira de fotos). Vocabulário de resumos/min-90-91.md.
     Em cada rodada a foto do livro aparece no enunciado e a criança escolhe o nome
     do material entre 3 opções (1 certa + 2 do próprio livro).
     Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre aparece).
     Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio em cada rodada,
     "Próxima" só aparece depois de responder. */

  const app = document.getElementById('app');
  const ID = 'min-qual';
  const TOTAL = 5;
  const PERGUNTA = 'Que material aparece na foto?';
  const APOIO = 'Olhe a foto e escolha o material.';

  /* foto · resposta certa · 2 distratores do livro · frase de feedback */
  const RODADAS = [
    {
      img: '../../img/hga/min/cobre.jpg',
      alt: 'Fios de cobre',
      certa: 'Cobre',
      erradas: ['Ferro', 'Areia'],
      msg: 'A foto mostra fios de cobre.'
    },
    {
      img: '../../img/hga/min/ferro.jpg',
      alt: 'Portão de ferro',
      certa: 'Ferro',
      erradas: ['Cobre', 'Cimento'],
      msg: 'A foto mostra um portão de ferro.'
    },
    {
      img: '../../img/hga/min/areia.jpg',
      alt: 'Monte de areia',
      certa: 'Areia',
      erradas: ['Calcário', 'Alumínio'],
      msg: 'A foto mostra um monte de areia.'
    },
    {
      img: '../../img/hga/min/aluminio.jpg',
      alt: 'Objeto de alumínio',
      certa: 'Alumínio',
      erradas: ['Ferro', 'Areia'],
      msg: 'A foto mostra um objeto de alumínio, que vem da bauxita.'
    },
    {
      img: '../../img/hga/min/cimento.jpg',
      alt: 'Sacos de cimento',
      certa: 'Cimento',
      erradas: ['Areia', 'Cobre'],
      msg: 'O cimento é feito de calcário.'
    }
  ];

  let i = 0;          // rodada da vez (0 a 4)
  let acertos = 0;    // acertos de primeira (a criança responde uma vez por rodada)

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 91; ícones Twemoji, CC-BY 4.0.</li>' +
      '<li>Palavras do livro didático (p. 90 e 91).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🔍" titulo="Qual é este material?" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(APOIO) + '"></fala-botoes>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o quiz em si é o componente do kit; a certa vai pelo TEXTO */
    const op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: PERGUNTA,
      opcoes: JogoKit.embaralhar([r.certa].concat(r.erradas)),
      certa: r.certa,
      msg: r.msg
    });

    /* a foto do livro fica no enunciado: antes das opções */
    const foto = document.createElement('img');
    foto.className = 'foto-material';
    foto.src = r.img;
    foto.alt = r.alt;
    op.insertBefore(foto, op.querySelector('.opcoes'));

    app.querySelector('[data-quiz]').appendChild(op);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="🔍" titulo="Qual é este material?" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você acertou tudo!" msg="Muito bem!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') { montar(); }
    else if (acao === 'outros') { location.href = 'index.html'; }
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
