<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toque nos certos — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .apoio{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .prox{margin-top:16px}
  fichas-toque .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 👆 Toque nos certos — extrativismo mineral, 3 rodadas.
     Base: livro p. 90 e 91. Vocabulário de resumos/min-90-91.md.
     Componente do kit: <fichas-toque> (toca para marcar, "Conferir" revela ✓/✗
     e a resposta certa sempre aparece).
     Regras TEA: frases curtas, 3 fichas por rodada, sem cronômetro, áudio por rodada. */

  const app = document.getElementById('app');
  const ID = 'min-toque';
  const TOTAL = 3;

  const RODADAS = [
    {
      pergunta: 'Toque nas 2 coisas feitas com cobre.',
      certas: ['Fios elétricos', 'Utensílios domésticos'],
      distrator: 'Portão de ferro',
      msg: 'O cobre faz fios e utensílios.',
      img: '../../img/hga/min/cobre.jpg',
      alt: 'Fios de cobre'
    },
    {
      pergunta: 'Toque nas 2 coisas feitas de ferro.',
      certas: ['Ferramentas', 'Automóveis'],
      distrator: 'Cimento',
      msg: 'Com o ferro fazemos ferramentas e automóveis.',
      img: '../../img/hga/min/ferro.jpg',
      alt: 'Peça de ferro'
    },
    {
      pergunta: 'Toque nos 2 recursos minerais.',
      certas: ['Areia', 'Calcário'],
      distrator: 'Leite',
      msg: 'Os minerais saem do solo e do subsolo.',
      img: '../../img/hga/min/areia.jpg',
      alt: 'Monte de areia'
    }
  ];

  let i = 0;          // rodada da vez (0 a 2)
  let acertos = 0;    // rodadas certas de primeira

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 90 e 91 (uso escolar).</li>' +
      '<li>Palavras do livro (p. 90 e 91): cobre, ferro, areia, calcário.</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="👆" titulo="Toque nos certos" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">Toque em 2 fichas e depois em Conferir.</p>' +
        '<div data-toque></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o "toque nos certos" é o componente do kit */
    const ft = document.createElement('fichas-toque');
    ft.montar({
      pergunta: r.pergunta,
      fichas: JogoKit.embaralhar(r.certas.concat([r.distrator])),
      certas: r.certas,
      msg: r.msg
    });

    /* foto de apoio: logo abaixo do enunciado e acima das fichas */
    const foto = document.createElement('img');
    foto.className = 'apoio';
    foto.src = r.img;
    foto.alt = r.alt || '';
    ft.insertBefore(foto, ft.querySelector('.fichas'));

    app.querySelector('[data-toque]').appendChild(ft);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    ft.addEventListener('conferido', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ Os certos são: ' + r.certas.join(', ') + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="👆" titulo="Toque nos certos" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você acertou tudo!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
