<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para que serve? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
  opcoes-resposta .hint{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 🔩 Para que serve? — quiz de 5 rodadas, uma pergunta por tela.
     Base: livro p. 90 e 91. Vocabulário de resumos/min-90-91.md.
     Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre aparece).
     Cada opção leva a sua própria foto do livro (o apoio não repete a mesma foto em toda rodada).
     Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio em cada rodada. */

  const app = document.getElementById('app');
  const ID = 'min-perguntas';
  const TOTAL = 5;
  const HINT = 'Toque na resposta.';

  /* foto do livro para cada opção (quando existe) */
  const FOTO = {
    'Cobre': 'cobre',
    'Ferro': 'ferro',
    'Areia': 'areia',
    'Calcário': 'cimento',
    'Cimento': 'cimento',
    'Alumínio': 'aluminio',
    'Bauxita': 'aluminio'
  };
  const icone = texto => FOTO[texto] ? ('../../img/hga/min/' + FOTO[texto] + '.jpg') : '';

  const RODADAS = [
    {
      pergunta: 'Qual mineral é usado para fazer fios elétricos?',
      certa: 'Cobre',
      erradas: ['Areia', 'Calcário'],
      msg: 'O cobre faz fios elétricos.'
    },
    {
      pergunta: 'O ferro, com outros elementos e muito calor, vira o quê?',
      certa: 'Aço',
      erradas: ['Cimento', 'Alumínio'],
      msg: 'O ferro pode virar aço.'
    },
    {
      pergunta: 'Qual mineral é usado para fazer alumínio?',
      certa: 'Bauxita',
      erradas: ['Cobre', 'Areia'],
      msg: 'O alumínio vem da bauxita.'
    },
    {
      pergunta: 'Qual recurso é usado para fazer cimento?',
      certa: 'Calcário',
      erradas: ['Ferro', 'Areia'],
      msg: 'O cimento vem do calcário.'
    },
    {
      pergunta: 'Em que atividade a areia é usada?',
      certa: 'Na construção',
      erradas: ['Para fazer fios elétricos', 'Para virar aço'],
      msg: 'A areia é usada na construção.'
    }
  ];

  let i = 0;          // rodada da vez (0 a 4)
  let acertos = 0;    // acertos de primeira (a criança responde uma vez por rodada)

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 90 e 91 (uso escolar).</li>' +
      '<li>Perguntas com palavras do livro (p. 90 e 91).</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🔩" titulo="Para que serve?" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o quiz em si é o componente do kit: cada opção com a sua foto do livro */
    const op = document.createElement('opcoes-resposta');
    const opcoes = JogoKit.embaralhar([r.certa].concat(r.erradas));
    op.montar({
      pergunta: r.pergunta,
      opcoes: opcoes,
      certa: r.certa,
      msg: r.msg,
      icones: opcoes.map(icone)
    });

    app.querySelector('[data-quiz]').appendChild(op);

    /* o enunciado vem primeiro; o áudio e a dica vêm logo depois dele */
    const fala = document.createElement('fala-botoes');
    fala.setAttribute('texto', r.pergunta);
    const dica = document.createElement('p');
    dica.className = 'hint';
    dica.textContent = HINT;
    const antesDasOpcoes = op.querySelector('.opcoes');
    op.insertBefore(fala, antesDasOpcoes);
    op.insertBefore(dica, antesDasOpcoes);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="🔩" titulo="Para que serve?" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
