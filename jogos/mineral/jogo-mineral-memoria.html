<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Memória dos minerais — Jogos do 3º ano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../jogo-kit.css">
  <script src="../jogo-kit.js"></script>
  <style>
    .tabuleiro { grid-template-columns: repeat(3, 1fr); }
    .carta { flex-direction: column; gap: 6px; cursor: pointer; }
    .carta .verso { font-size: 2rem; line-height: 1; }
    .carta.virada img { width: 64%; height: auto; max-height: 64%; object-fit: contain; }
    .carta .nome { font-size: .95rem; }
    .carta.travada { cursor: default; }
    .recorde { color: var(--muted); font-size: .9rem; margin: 10px 0 0; text-align: center; font-weight: 700; }
    @media (max-width: 420px) { .tabuleiro { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    JogoKit.iniciarMemoria({
      id: 'mem-min',
      icone: '⛏️',
      titulo: 'Memória dos minerais',
      instrucao: 'Encontre os dois iguais. Ache os 3 pares de minerais.',
      pares: [
        { id: 'cobre', nome: 'Cobre', foto: '../../img/hga/min/cobre.jpg', frase: 'Fios de cobre conduzem eletricidade.' },
        { id: 'ferro', nome: 'Ferro', foto: '../../img/hga/min/ferro.jpg', frase: 'O ferro é resistente.' },
        { id: 'cimento', nome: 'Cimento', foto: '../../img/hga/min/cimento.jpg', frase: 'O cimento é feito de calcário.' }
      ],
      creditos: 'Livro didático p. 90, 91 (extrativismo mineral, cobre, ferro e calcário).'
    });
  </script>
</body>
</html>
