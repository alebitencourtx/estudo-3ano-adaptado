<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memória dos minerais — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
/* ===== Memória dos minerais — ajustes locais (o resto vem do jogo-kit.css) =====
   Regras TEA: sem cronômetro, sem erro punido, poucas opções, feedback imediato. */
.tabuleiro{grid-template-columns:repeat(3,1fr)}          /* 6 cartas = 2 linhas de 3 */
.carta{flex-direction:column;gap:6px;cursor:pointer}
.carta .verso{font-size:2rem;line-height:1}
.carta.virada img{width:64%;height:auto;max-height:64%;object-fit:contain}
.carta .nome{font-size:.95rem}
.carta.travada{cursor:default}
.recorde{color:var(--muted);font-size:.9rem;margin:10px 0 0;text-align:center;font-weight:700}
@media (max-width:420px){ .tabuleiro{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Memória dos minerais — jogo da memória (extrativismo mineral, p. 90, 91) =====
   Conteúdo do livro: o cobre faz fios elétricos; o ferro faz portões e ferramentas;
   do calcário vem o cimento. 3 pares (6 cartas).
   Sem cronômetro: o placar guarda o MENOR número de tentativas.
   Fotos do livro didático; ícones Twemoji, CC-BY 4.0. */

const PARES = [
  { id:'cobre',   nome:'Cobre',   foto:'../../img/hga/min/cobre.jpg',   fato:'Fios de cobre.' },
  { id:'ferro',   nome:'Ferro',   foto:'../../img/hga/min/ferro.jpg',   fato:'Portão de ferro.' },
  { id:'cimento', nome:'Calcário', foto:'../../img/hga/min/cimento.jpg', fato:'Do calcário vem o cimento.' }
];
const TOTAL = 3;                 /* 3 pares */
const ID_PROG = 'mem-min';       /* chave do progresso (menor nº de tentativas) */
const ESPERA = 900;              /* ms com as 2 cartas diferentes abertas */
const INSTRUCAO = 'Encontre os 3 pares de fotos iguais.';

const app = document.getElementById('app');
let S = null;                    /* estado da partida */
let timer = null;                /* setTimeout das cartas diferentes */

/* ---------- progresso: guardar o MENOR número de tentativas ---------- */
/* JogoKit.progresso.melhor() guarda o MAIOR valor ("quanto mais, melhor");
   aqui o bom é o menor, então comparamos e usamos gravar(). */
function lerRecorde() {
  const p = JogoKit.progresso.ler();
  const r = p[ID_PROG];
  return (typeof r === 'number' && isFinite(r)) ? r : null;
}
function gravarRecorde(n) {
  const antigo = lerRecorde();
  if (antigo == null || n < antigo) JogoKit.progresso.gravar(ID_PROG, n);   /* menor é melhor */
  return antigo == null || n < antigo;
}

/* ---------- estrelas: menos tentativas, mais estrelas ---------- */
function estrelas(tentativas) {
  if (tentativas <= TOTAL) return TOTAL;         /* 3 tentativas = acertou todos de primeira */
  if (tentativas <= TOTAL + 2) return TOTAL - 1; /* 4 ou 5 tentativas */
  return 1;
}

/* ---------- conteúdo ---------- */
const rodape = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
  + '<li>Fotos do livro didático, páginas 90 e 91 (uso escolar).</li>'
  + '<li>Ícones: Twemoji, CC-BY 4.0.</li>'
  + '</ul></details>';

/* ---------- telas ---------- */
function comecar() {
  if (timer) { clearTimeout(timer); timer = null; }
  S = { pares:0, tentativas:0, primeira:null, trava:false };
  renderJogo();
}

function renderJogo() {
  const rec = lerRecorde();
  const cartas = JogoKit.embaralhar(PARES.concat(PARES));     /* 3 pares embaralhados */
  app.innerHTML =
    '<jogo-topo icone="⛏️" titulo="Memória dos minerais" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
    '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>' +
    '<section class="card">' +
      '<p class="pergunta" id="instrucao">' + INSTRUCAO + '</p>' +
      '<fala-botoes texto="' + INSTRUCAO + '"></fala-botoes>' +
      '<div class="tabuleiro" id="tabuleiro" aria-label="Cartas do jogo" style="margin-top:16px">' +
        cartas.map(cartaHtml).join('') +
      '</div>' +
      '<p class="feed" id="feed" aria-live="polite"></p>' +
      '<p class="recorde" id="recorde">' +
        (rec == null ? 'Cada foto aparece em duas cartas.'
                     : 'Seu recorde: ' + rec + (rec === 1 ? ' tentativa.' : ' tentativas.')) +
      '</p>' +
    '</section>' + rodape;

  app.querySelectorAll('.carta').forEach(ligarCarta);
  atualizarProgresso();
  window.scrollTo(0, 0);
}

function cartaHtml(p) {
  return '<div class="carta" data-par="' + JogoKit.esc(p.id) + '" role="button" tabindex="0" ' +
    'aria-label="Carta fechada"><span class="verso">?</span></div>';
}

function virar(carta) {
  const p = PARES.find(x => x.id === carta.dataset.par);
  if (!p) return;
  carta.classList.add('virada');
  carta.innerHTML = '<img src="' + JogoKit.esc(p.foto) + '" alt=""><span class="nome">' + JogoKit.esc(p.nome) + '</span>';
  carta.setAttribute('aria-label', p.nome);
}

function fechar(carta) {
  carta.classList.remove('virada');
  carta.innerHTML = '<span class="verso">?</span>';
  carta.setAttribute('aria-label', 'Carta fechada');
}

function ligarCarta(carta) {
  carta.addEventListener('click', () => tocar(carta));
  carta.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocar(carta); }
  });
}

/* ---------- ação principal: tocar numa carta ---------- */
function tocar(carta) {
  if (S.trava) return;
  if (carta.classList.contains('travada') || carta.classList.contains('virada')) return;

  virar(carta);
  if (!S.primeira) { S.primeira = carta; return; }        /* primeira carta: só abre */

  const a = S.primeira, b = carta;
  S.primeira = null;
  S.tentativas++;

  if (a.dataset.par === b.dataset.par) {                  /* iguais: as duas ficam travadas */
    const p = PARES.find(x => x.id === a.dataset.par);
    [a, b].forEach(c => { c.classList.add('travada'); c.setAttribute('aria-label', p.nome + ', igual'); });
    diz('✓ ' + p.fato, 'ok');
    JogoKit.falar(p.fato, 0.85);
    S.pares++;
    atualizarProgresso();
    if (S.pares === TOTAL) {
      S.trava = true;
      timer = setTimeout(() => { timer = null; mostrarFim(); }, ESPERA);
    }
  } else {                                                /* diferentes: nunca punir */
    S.trava = true;
    diz('Olhe de novo. Procure as duas iguais.', '');      /* feedback neutro: sem cor de erro */
    JogoKit.falar('Olhe de novo. Procure as duas iguais.', 0.85);
    timer = setTimeout(() => {
      timer = null;
      fechar(a); fechar(b);
      S.trava = false;
    }, ESPERA);
  }
}

function atualizarProgresso() {
  const topo = app.querySelector('jogo-topo');
  if (topo) topo.contador = S.pares + '/' + TOTAL;
  const barra = app.querySelector('barra-progresso');
  if (barra) barra.atualizar(S.pares, TOTAL);
}

function diz(txt, tipo) {
  const f = document.getElementById('feed');
  if (!f) return;
  f.textContent = txt;
  f.className = 'feed' + (tipo ? ' ' + tipo : '');
}

/* ---------- tela final ---------- */
function mostrarFim() {
  const rec = lerRecorde();
  const novo = gravarRecorde(S.tentativas);
  const recorde = novo ? S.tentativas : rec;
  const n = estrelas(S.tentativas);
  const msg = (novo && rec != null ? 'Novo recorde! ' : '') +
    'Você fez os 3 pares em ' + S.tentativas + (S.tentativas === 1 ? ' tentativa.' : ' tentativas.');

  app.innerHTML =
    '<tela-fim icone="⛏️" titulo="Memória dos minerais" estrelas="' + n + '" total="' + TOTAL + '" ' +
      'resumo="Você achou os 3 pares!" msg="' + JogoKit.esc(msg) + '"></tela-fim>' + rodape;
  JogoKit.falar('Você achou os 3 pares! Seu recorde: ' + recorde + (recorde === 1 ? ' tentativa.' : ' tentativas.'), 0.85);
  window.scrollTo(0, 0);
}

/* ---------- eventos dos componentes do kit ---------- */
app.addEventListener('voltar', () => { location.href = 'index.html'; });
app.addEventListener('fim', e => {
  if (e.detail && e.detail.acao === 'denovo') comecar();
  else location.href = 'index.html';
});

comecar();
</script>
</body>
</html>
