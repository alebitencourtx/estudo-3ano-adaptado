<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sim ou não? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .apoio{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
  /* Sim/Não: dois botões grandes, lado a lado quando a tela é larga */
  opcoes-resposta .opcao-btn{justify-content:center;min-height:88px;font-size:1.4rem;font-weight:800}
  @media (min-width:420px){ opcoes-resposta .opcoes{flex-direction:row} opcoes-resposta .opcoes .opcao-btn{flex:1} }
  .quadro{margin:8px 0 0;padding:0;list-style:none;font-size:1rem;color:var(--text)}
  .quadro li{margin:6px 0;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--acc-soft)}
  .quadro b{color:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* ❓ Sim ou não? — 4 rodadas de sim/não, uma pergunta por tela.
     Base: livro p. 104 e 105 (cinema: 1895 mudo, 1927 com falas, cor e 3-D).
     Vocabulário fechado de _espec/campo-cidade.md.
     Componente do kit: <opcoes-resposta> com opcoes:['Sim','Não'] (feedback imediato;
     a resposta certa sempre aparece em .ok). Regras TEA: frases curtas, 2 opções,
     sem cronômetro, áudio do enunciado em cada rodada. */

  const app = document.getElementById('app');
  const ID = 'cc-filme';
  const TOTAL = 4;
  const OPCOES = ['Sim', 'Não'];

  const RODADAS = [
    {
      pergunta: 'Em 1895, o cinema era mudo?',
      certa: 'Sim',
      msg: 'O filme de 1895 era mudo.',
      img: '../../img/hga/cc/cinema-1895.jpg',
      alt: 'Cena do filme A saída dos trabalhadores da fábrica, de 1895'
    },
    {
      pergunta: 'Hoje os filmes são coloridos?',
      certa: 'Sim',
      msg: 'Hoje os filmes são coloridos.',
      img: '../../img/hga/cc/branca-neve.jpg',
      alt: 'Foto do desenho de 1937, Branca de Neve, já colorido'
    },
    {
      pergunta: 'O 3-D já existia em 1895?',
      certa: 'Não',
      msg: 'O 3-D chegou em 1953, com Museu de cera.',
      img: '../../img/hga/cc/museu-cera.jpg',
      alt: 'Foto do filme de 1953, em 3-D'
    },
    {
      pergunta: 'O primeiro filme com falas foi em 1927?',
      certa: 'Sim',
      msg: 'Em 1927 veio o primeiro filme com falas.',
      img: '../../img/hga/cc/cinema-1927.jpg',
      alt: 'Foto do filme de 1927, o primeiro com falas'
    }
  ];

  let i = 0;          // rodada da vez (0 a 3)
  let acertos = 0;    // acertos de primeira (a criança responde uma vez por rodada)

  /* ---------- pedaços de tela ---------- */
  /* o quadro do livro (p. 105) aparece no fim do jogo */
  function quadro() {
    return '<details class="detalhes"><summary>O que mudou no cinema</summary>' +
      '<ul class="quadro">' +
      '<li><b>mudo</b> → <b>sonoro</b></li>' +
      '<li><b>preto e branco</b> → <b>colorido</b></li>' +
      '<li><b>3-D não existia</b> → <b>existe</b></li>' +
      '</ul></details>';
  }

  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 104 e 105 (uso escolar).</li>' +
      '<li>Informações do quadro da p. 105 do livro (uso escolar).</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="❓" titulo="Sim ou não?" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">Toque em Sim ou Não.</p>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o quiz em si é o componente do kit: 2 opções, Sim e Não */
    const op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: r.pergunta,
      opcoes: OPCOES,
      certa: r.certa,
      msg: r.msg
    });

    /* foto de apoio, quando houver: logo abaixo do enunciado e acima das opções */
    if (r.img) {
      const foto = document.createElement('img');
      foto.className = 'apoio';
      foto.src = r.img;
      foto.alt = r.alt || '';
      op.insertBefore(foto, op.querySelector('.opcoes'));
    }

    app.querySelector('[data-quiz]').appendChild(op);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="❓" titulo="Sim ou não?" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!"></tela-fim>' +
      quadro() +
      rodape();
    JogoKit.falar('Você respondeu tudo!', 0.85);
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
