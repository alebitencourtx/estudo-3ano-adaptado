<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Em 1895 ou atualmente? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  jogo-topo,barra-progresso,tela-fim{display:block}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Em 1895 ou atualmente? (livro p. 105) =====
   Classificar os seis itens do quadro do livro em duas caixas — 3 cartões por tela
   (nunca 6 de uma vez: regra TEA de carga baixa).
   As respostas reproduzem o quadro: mudo/sonoro, preto e branco/colorido, 3-D.
   Regras TEA: 1 instrução, 2 destinos, 3 peças por tela, frases curtas, sem cronômetro,
   aprendizagem sem erro — o erro mostra a frase certa e a caixa certa pisca.
   Fonte: livro p. 105. Ícones: Twemoji, CC-BY 4.0. */

const ID = 'cc-antes-agora';
const TOTAL = 6;                 /* 6 cartões no jogo inteiro */
const POR_TELA = 3;              /* 3 cartões por tela */
const TELAS = 2;

const ALVOS = [
  { id: '1895',      ico: '../../img/jogo/cc/cinema.svg', nome: 'Em 1895' },
  { id: 'atualmente', ico: '../../img/jogo/cc/camera.svg', nome: 'Atualmente' }
];

const CARTÕES = [
  /* ----- tela 1: coluna "Em 1895" do quadro ----- */
  { id: 'mudo', alvo: '1895', ico: '../../img/jogo/cc/cinema.svg',
    nome: 'Mudo', msg: 'Em 1895, o cinema era mudo.' },
  { id: 'pb', alvo: '1895', ico: '../../img/jogo/cc/camera.svg',
    nome: 'Preto e branco', msg: 'Em 1895, o cinema era preto e branco.' },
  { id: 'sem-3d', alvo: '1895', ico: '../../img/jogo/cc/cinema.svg',
    nome: '3-D não existia', msg: 'Em 1895, a tecnologia 3-D não existia.' },
  /* ----- tela 2: coluna "Atualmente" do quadro ----- */
  { id: 'sonoro', alvo: 'atualmente', ico: '../../img/jogo/cc/cinema.svg',
    nome: 'Sonoro', msg: 'Atualmente, os filmes são sonoros.' },
  { id: 'colorido', alvo: 'atualmente', ico: '../../img/jogo/cc/camera.svg',
    nome: 'Colorido', msg: 'Atualmente, os filmes são coloridos.' },
  { id: 'com-3d', alvo: 'atualmente', ico: '../../img/jogo/cc/cinema.svg',
    nome: '3-D existe', msg: 'Atualmente, a tecnologia 3-D existe.' }
];

const CREDITOS = [
  'Ícones de cinema e câmera: Twemoji, CC-BY 4.0.',
  'Texto base: quadro do livro do 3º ano, p. 105.'
];

const RODAPE = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
  + CREDITOS.map(c => '<li>' + JogoKit.esc(c) + '</li>').join('')
  + '</ul></details>';

const app = document.getElementById('app');
let S = null;                       /* { tela, colocadas } */

/* cartões da tela da vez (3 por tela) */
function cartoesDaTela(tela) {
  return CARTÕES.slice(tela * POR_TELA, (tela + 1) * POR_TELA);
}

/* componentes web criados por innerHTML: garante que já renderizaram */
function montarComponentes() {
  app.querySelectorAll('jogo-topo,barra-progresso,tela-fim').forEach(el => {
    if (!el.firstElementChild && typeof el.connectedCallback === 'function') el.connectedCallback();
  });
}

/* o cartão mostra o ícone e o nome */
function cartaoHtml(p) {
  return JogoKit.pecaHtml(p);
}

function atualizar() {
  const cont = app.querySelector('jogo-topo [data-contador]');
  if (cont) {
    cont.textContent = S.colocadas + '/' + TOTAL;
    cont.setAttribute('aria-live', 'polite');
  }
  const bar = app.querySelector('barra-progresso');
  if (bar) {
    if (!bar.querySelector('.bar') && typeof bar.render === 'function') bar.render();
    if (typeof bar.atualizar === 'function') bar.atualizar(S.colocadas, TOTAL);
  }
}

function diz(texto, ok) {
  const f = app.querySelector('#feed');
  if (!f) return;
  f.textContent = texto;
  f.className = 'feed ' + (ok ? 'ok' : 'bad');
}

function pulso(el) {
  el.classList.add('pulso');
  setTimeout(() => el.classList.remove('pulso'), 1400);
}

/* ---------- telas ---------- */
function renderJogo() {
  JogoKit.arrasto.limpar();
  S = { tela: 0, colocadas: 0 };
  renderTela();
}

function renderTela() {
  JogoKit.arrasto.limpar();
  const cartoes = JogoKit.embaralhar(cartoesDaTela(S.tela));

  app.innerHTML =
    '<jogo-topo icone="🎬" titulo="Em 1895 ou atualmente?" contador="' + S.colocadas + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>'
    + '<barra-progresso valor="' + S.colocadas + '" total="' + TOTAL + '"></barra-progresso>'
    + '<section class="card">'
      + '<p class="pergunta">Este cartão é de 1895 ou de hoje?</p>'
      + '<fala-botoes texto="Ligue cada cartão ao tempo: 1895 ou hoje."></fala-botoes>'
      + '<p class="hint">Arraste o cartão. Ou toque no cartão e na caixa.</p>'
      + '<div class="alvos" id="alvos" style="margin-top:16px">'
        + ALVOS.map(a =>
            '<div class="alvo" data-id="' + a.id + '" role="button" tabindex="0" aria-label="' + JogoKit.esc(a.nome) + '">'
            + '<img class="ico" src="' + JogoKit.esc(a.ico) + '" alt="">'
            + '<span class="nome">' + JogoKit.esc(a.nome) + '</span>'
            + '<span class="encaixados"></span>'
          + '</div>').join('')
      + '</div>'
      + '<div class="bandeja" id="bandeja">'
        + cartoes.map(cartaoHtml).join('')
      + '</div>'
      + '<p class="feed" id="feed" aria-live="polite"></p>'
    + '</section>'
    + RODAPE;

  montarComponentes();
  atualizar();

  const topo = app.querySelector('jogo-topo');
  if (topo) topo.addEventListener('voltar', () => { location.href = 'index.html'; });

  app.querySelectorAll('.peca').forEach(peca => JogoKit.arrasto.ligar(peca, soltar, falarNome));
  app.querySelectorAll('.alvo').forEach(alvo => JogoKit.arrasto.ligarAlvo(alvo, soltar));
  window.scrollTo(0, 0);
}

function falarNome(peca) {
  if (!peca) return;
  const n = peca.querySelector('.nome');
  if (n) JogoKit.falar(n.textContent, 0.85);
}

/* ---------- soltar o cartão: certo ou errado ---------- */
function soltar(peca, alvo) {
  if (!peca || !alvo || peca.dataset.feita) return;
  const certo = peca.dataset.alvo === alvo.dataset.id;

  if (certo) {
    peca.dataset.feita = '1';
    peca.classList.add('encaixada');
    const caixa = alvo.querySelector('.encaixados');
    if (caixa) caixa.appendChild(peca);
    JogoKit.arrasto.limpar();
    S.colocadas++;
    diz('✓ ' + peca.dataset.msg, true);
    JogoKit.falar(peca.dataset.msg, 0.85);
    atualizar();
    if (telaCheia()) {
      if (S.tela + 1 < TELAS) setTimeout(proximaTela, 900);
      else setTimeout(renderFim, 900);
    }
  } else {
    /* o erro mostra a frase certa e pisca a caixa certa; o cartão continua
       selecionado — é só tocar na caixa certa. */
    diz('✗ ' + peca.dataset.msg, false);
    JogoKit.falar(peca.dataset.msg, 0.85);
    pulso(peca);
    const bom = app.querySelector('.alvo[data-id="' + peca.dataset.alvo + '"]');
    if (bom) {
      bom.classList.add('brilho');
      setTimeout(() => bom.classList.remove('brilho'), 2200);
    }
  }
}

/* a tela da vez já está toda no lugar? */
function telaCheia() {
  return app.querySelectorAll('.peca.encaixada').length === POR_TELA;
}

function proximaTela() {
  S.tela++;
  renderTela();
}

/* ---------- tela final ---------- */
function renderFim() {
  JogoKit.arrasto.limpar();
  /* aprendizagem sem erro: o jogo sempre termina com todas as estrelas */
  JogoKit.progresso.melhor(ID, 1);

  app.innerHTML =
    '<tela-fim icone="🎬" titulo="Em 1895 ou atualmente?" estrelas="' + TOTAL + '" total="' + TOTAL + '"'
    + ' resumo="Você colocou tudo no lugar!"></tela-fim>'
    + RODAPE;

  montarComponentes();

  const tf = app.querySelector('tela-fim');
  if (tf) tf.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();
    else location.href = 'index.html';
  });

  JogoKit.falar('Você colocou tudo no lugar!', 0.85);
  window.scrollTo(0, 0);
}

renderJogo();
</script>
</body>
</html>
