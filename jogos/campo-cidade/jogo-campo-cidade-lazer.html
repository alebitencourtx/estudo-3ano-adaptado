<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O passeio de dona Alice — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .apoio{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .apoio.ico{max-height:150px;object-fit:contain;background:#fff}
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 🧺 O passeio de dona Alice — quiz de 6 rodadas, uma pergunta por tela.
     Base: depoimento "Passeio especial" de dona Alice (livro p. 102).
     Vocabulário fechado de _espec/campo-cidade.md.
     Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre aparece).
     Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio em cada rodada. */

  const app = document.getElementById('app');
  const ID = 'cc-lazer';
  const TOTAL = 6;
  /* o Jardim da Luz só ilustra a rodada do Jardim da Luz; o piquenique usa a cesta */
  const FOTO = '../../img/hga/cc/jardim-luz.jpg';
  const ALT = 'Foto antiga de pessoas passeando no Jardim da Luz, em 1910';
  const CESTA = '../../img/jogo/cc/cesta.svg';
  const ALT_CESTA = 'Cesta de piquenique';

  const RODADAS = [
    {
      pergunta: 'Onde dona Alice fazia piquenique?',
      certa: 'Na Cantareira e no Parque Antártica',
      erradas: ['No Jardim da Luz', 'No cinema'],
      msg: 'Ela fazia piquenique na Cantareira e no Parque Antártica.',
      img: CESTA,
      alt: ALT_CESTA
    },
    {
      pergunta: 'Onde Alice passeava aos domingos depois do almoço?',
      certa: 'No Jardim da Luz',
      erradas: ['Na Cantareira', 'No Parque Antártica'],
      msg: 'Ela passeava no Jardim da Luz.',
      img: FOTO,
      alt: ALT
    },
    {
      pergunta: 'Quem ia junto com Alice?',
      certa: 'As famílias amigas',
      erradas: ['Os irmãos Lumière', 'Os trabalhadores da fábrica'],
      msg: 'Ia com as famílias amigas.'
    },
    {
      pergunta: 'O que Alice dizia sobre o Jardim da Luz?',
      certa: 'Muito bem tratado e agradável',
      erradas: ['Na Cantareira', 'No Parque Antártica'],
      msg: 'Ela dizia: tudo muito bem tratado, agradável.'
    },
    {
      pergunta: 'Em que cidade fica o Jardim da Luz?',
      certa: 'São Paulo',
      erradas: ['Na França', 'Nos Estados Unidos'],
      msg: 'O Jardim da Luz fica em São Paulo.'
    },
    {
      pergunta: 'Em que ano foi tirada a foto do Jardim da Luz?',
      certa: 'Em 1910',
      erradas: ['Em 1895', 'Em 1927'],
      msg: 'A foto do Jardim da Luz é de 1910.',
      img: FOTO,
      alt: ALT
    }
  ];

  let i = 0;          // rodada da vez (0 a 5)
  let acertos = 0;    // acertos de primeira (a criança responde uma vez por rodada)

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 102 (uso escolar).</li>' +
      '<li>Depoimento de dona Alice conforme o livro (p. 102).</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🧺" titulo="O passeio de dona Alice" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + (i + 1) + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">Toque na resposta.</p>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o quiz em si é o componente do kit */
    const op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: r.pergunta,
      opcoes: JogoKit.embaralhar([r.certa].concat(r.erradas)),
      certa: r.certa,
      msg: r.msg
    });

    /* foto de apoio, quando houver: logo abaixo do enunciado e acima das opções */
    if (r.img) {
      const foto = document.createElement('img');
      foto.className = 'apoio' + (/\.svg$/i.test(r.img) ? ' ico' : '');
      foto.src = r.img;
      foto.alt = r.alt || '';
      op.insertBefore(foto, op.querySelector('.opcoes'));
    }

    app.querySelector('[data-quiz]').appendChild(op);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="🧺" titulo="O passeio de dona Alice" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!"></tela-fim>' +
      rodape();
    JogoKit.falar('Você respondeu tudo!', 0.85);
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
