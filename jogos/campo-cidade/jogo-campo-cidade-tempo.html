<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linha do tempo do cinema — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
/* ===== extras só desta página (o resto vem de jogo-kit.css) ===== */
.parada{cursor:pointer;justify-content:flex-start}
.parada.atual{background:var(--acc-soft)}
.parada.feita{cursor:default}
.parada .oculta{display:flex;align-items:center;justify-content:center;width:100%;height:110px;
  border:2px dashed var(--line);border-radius:12px;background:var(--paper);
  color:var(--muted);font-family:var(--font-display);font-weight:800;font-size:2rem}
.parada .marca{color:var(--ok);font-weight:900;font-size:1.3rem;line-height:1}
.parada .frase{margin:0;font-size:.95rem;font-weight:700}
.parada img{max-height:110px}
.quadro{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px;color:var(--ink)}
.quadro th,.quadro td{border:2px solid var(--line);padding:6px 8px;text-align:left}
.quadro th{background:var(--acc-soft);font-family:var(--font-display)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Linha do tempo do cinema — p. 102, 104, 105 =====
   Lazer nas cidades brasileiras há cerca de cem anos: o cinema e as
   mudanças dele (mudo → sonoro, preto e branco → colorido, 3-D).
   Regras TEA: 1 instrução por tela, sem cronômetro, aprendizagem sem erro —
   só a parada destacada avança; tocar fora de ordem só explica qual é a vez.
   Fotos do livro: p. 102 (1895), p. 104 (1927 e 1937) e p. 105 (1953). */

const PARADAS = [
  { ano: 1895, foto: '../../img/hga/cc/cinema-1895.jpg',
    alt: 'Foto antiga da primeira exibição de cinema, em 1895',
    frase: '1895: o cinema era mudo e preto e branco.' },
  { ano: 1927, foto: '../../img/hga/cc/cinema-1927.jpg',
    alt: 'Foto do filme de 1927, o primeiro com falas',
    frase: '1927: o primeiro filme com falas.' },
  { ano: 1937, foto: '../../img/hga/cc/branca-neve.jpg',
    alt: 'Foto do desenho de 1937, Branca de Neve, já colorido',
    frase: '1937: os desenhos ganharam cor, com Branca de Neve.' },
  { ano: 1953, foto: '../../img/hga/cc/museu-cera.jpg',
    alt: 'Foto do filme de 1953, em 3-D',
    frase: '1953: o cinema em 3-D, com Museu de cera.' }
];
const ID = 'tempo-cc';
const INSTRUCAO = 'Passeie pela linha do tempo do cinema. Toque na parada que está brilhando.';
const DICA = 'Toque na parada que está brilhando.';
const CREDITOS = [
  'Fotos do cinema: livro do 3º ano, História e Geografia — p. 102, 104 e 105 (uso escolar).',
  'História do cinema conforme o quadro da p. 105.'
];

function boot () {
  'use strict';
  const K = window.JogoKit;
  const esc = K.esc;
  const app = document.getElementById('app');
  let S = { i: 0 };                       /* i = parada da vez (0..4) */

  /* ---------- pedaços de tela ---------- */
  function rodapeHtml () {
    return '<p class="rodape"><a href="../index.html">← Todos os jogos</a> · <a href="../../index.html">← Treino</a></p>';
  }

  function creditosHtml () {
    return '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      CREDITOS.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></details>';
  }

  function paradaHtml (p, k) {
    const feita = k < S.i, atual = k === S.i, vista = k <= S.i;
    return '<div class="parada' + (feita ? ' feita' : '') + (atual ? ' atual' : '') +
      '" data-i="' + k + '" role="button" tabindex="0" aria-label="' +
      esc(atual ? 'Parada de ' + p.ano + '. Toque aqui.' : 'Parada de ' + p.ano) + '">' +
      '<span class="ano">' + p.ano + '</span>' +
      (vista ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.alt) + '">'
             : '<span class="oculta" aria-hidden="true">?</span>') +
      (feita ? '<span class="marca" aria-hidden="true">✓</span>' : '') +
      (feita ? '<p class="frase">' + esc(p.frase) + '</p>' : '') +
      '</div>';
  }

  /* ---------- telas ---------- */
  function render () {
    const n = PARADAS.length, i = S.i;
    app.innerHTML =
      '<jogo-topo icone="🎬" titulo="Linha do tempo do cinema" contador="' + i + '/' + n +
        '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + n + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + esc(INSTRUCAO) + '"></fala-botoes>' +
        '<p class="hint">' + esc(DICA) + '</p>' +
        '<div class="trilha">' + PARADAS.map(paradaHtml).join('') + '</div>' +
        '<p class="feed" id="feed" aria-live="polite"></p>' +
      '</section>' +
      rodapeHtml() + creditosHtml();

    app.querySelectorAll('.parada').forEach(el => {
      const k = +el.dataset.i;
      el.addEventListener('click', () => tocar(k));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocar(k); }
      });
    });
    window.scrollTo(0, 0);
  }

  function renderFim () {
    K.progresso.melhor(ID, PARADAS.length);
    app.innerHTML =
      '<tela-fim icone="🎬" titulo="Linha do tempo do cinema" estrelas="4" total="4" ' +
        'resumo="Você visitou todas as paradas!" ' +
        'msg="Muito bem! Você viu o cinema mudar do mudo ao sonoro."></tela-fim>' +
      '<section class="card">' +
        '<details class="detalhes" open><summary>O que mudou no cinema (p. 105)</summary>' +
          '<table class="quadro">' +
            '<tr><th>Tipo</th><th>Em 1895</th><th>Atualmente</th></tr>' +
            '<tr><td>Mudo ou sonoro</td><td>mudo</td><td>sonoro</td></tr>' +
            '<tr><td>Preto e branco ou colorido</td><td>preto e branco</td><td>colorido</td></tr>' +
            '<tr><td>Tecnologia 3-D</td><td>não existia</td><td>existe</td></tr>' +
          '</table></details>' +
      '</section>' +
      rodapeHtml() + creditosHtml();
    window.scrollTo(0, 0);
  }

  /* ---------- aviso curto na tela ---------- */
  function diz (txt, ok) {
    const f = app.querySelector('#feed');
    if (!f) return;
    f.textContent = txt;
    f.className = 'feed ' + (ok ? 'ok' : 'bad');
  }

  /* ---------- ação principal: tocar numa parada ---------- */
  function tocar (k) {
    if (k !== S.i) {                       /* fora de ordem: só explica qual é a vez */
      const ano = PARADAS[S.i].ano;
      diz('✗ Agora é a parada de ' + ano + '.', false);
      K.falar('Agora é a parada de ' + ano + '.', 0.85);
      return;
    }
    const p = PARADAS[S.i];
    S.i++;
    render();                              /* marca .feita, revela a próxima, tira o .atual */
    diz('✓ ' + p.frase, true);
    K.falar(p.frase, 0.85);
    if (S.i === PARADAS.length) setTimeout(renderFim, 700);
  }

  /* ---------- eventos dos componentes ---------- */
  app.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') { S = { i: 0 }; render(); }
    else if (acao === 'outros') { window.location.href = 'index.html'; }
  });
  app.addEventListener('voltar', () => { window.location.href = 'index.html'; });

  render();
}

/* Espera o kit e o <main> ficarem prontos (no navegador o kit já vem do <head>). */
(function espera (t) {
  if (window.JogoKit && document.getElementById('app')) { boot(); return; }
  if (t < 5000) setTimeout(() => espera(t + 25), 25);
})(0);
</script>
</body>
</html>
