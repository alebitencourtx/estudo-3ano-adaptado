<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Memória do campo — Jogos do 3º ano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../jogo-kit.css">
  <script src="../jogo-kit.js"></script>
  <style>
    .tabuleiro { grid-template-columns: repeat(3, 1fr); }
    .carta { flex-direction: column; gap: 6px; cursor: pointer; }
    .carta .verso { font-size: 2rem; line-height: 1; }
    .carta.virada img { width: 64%; height: auto; max-height: 64%; object-fit: contain; }
    .carta .nome { font-size: .95rem; }
    .carta.travada { cursor: default; }
    .recorde { color: var(--muted); font-size: .9rem; margin: 10px 0 0; text-align: center; font-weight: 700; }
    @media (max-width: 420px) { .tabuleiro { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    JogoKit.iniciarMemoria({
      id: 'mem-agr',
      icone: '🌾',
      titulo: 'Memória do campo',
      instrucao: 'Encontre os dois iguais. Ache os 3 pares do campo.',
      pares: [
        { id: 'arado', nome: 'Arado', foto: '../../img/hga/agr/arado.jpg', frase: 'O arado prepara a terra.' },
        { id: 'colheitadeira', nome: 'Colheitadeira', foto: '../../img/hga/agr/colheitadeira.jpg', frase: 'A colheitadeira colhe os grãos.' },
        { id: 'robo', nome: 'Robô de ordenha', foto: '../../img/hga/agr/ordenha.jpg', frase: 'O robô tira o leite da vaca.' }
      ],
      creditos: 'Livro didático p. 84, 85, 92, 95 (instrumento simples = arado; máquina = colheitadeira; ordenha moderna).'
    });
  </script>
</body>
</html>
