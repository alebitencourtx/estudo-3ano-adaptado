<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O leite no tempo — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
/* ===== extras só desta página (o resto vem de jogo-kit.css) ===== */
.parada{cursor:pointer;justify-content:flex-start}
.parada.atual{background:var(--acc-soft)}
.parada.feita{cursor:default}
.parada .oculta{display:flex;align-items:center;justify-content:center;width:100%;height:110px;
  border:2px dashed var(--line);border-radius:12px;background:var(--paper);
  color:var(--muted);font-family:var(--font-display);font-weight:800;font-size:2rem}
.parada .marca{color:var(--ok);font-weight:900;font-size:1.3rem;line-height:1}
.parada .frase{margin:0;font-size:.95rem;font-weight:700}
.parada img{max-height:110px}
.painel{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.painel .foto{width:min(240px,100%);max-height:180px;object-fit:cover;border-radius:14px;border:2px solid var(--line)}
.painel .texto{flex:1 1 240px;min-width:200px}
.painel .ano{font-family:var(--font-display);font-weight:800;font-size:1.4rem;color:var(--acc);margin:0}
.painel .frase{font-weight:800;font-size:1.02rem;margin:4px 0 6px;color:var(--ink)}
.painel .completo{margin:0;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== O leite no tempo — p. 94 e 95 =====
   A ordenha (retirada do leite das vacas e das cabras) mudou: há cem anos era
   só manual; em 2013 chegou ao Brasil a ordenha com robôs (a vaca vai sozinha
   até a sala de ordenha, atraída pela ração no cocho; um braço robótico tira o
   leite, que vai direto ao tanque); hoje, cresceu a ordenha mecânica.
   Fotos do acervo: ordenha.jpg é a ilustração da ordenha MANUAL (p. 94) e
   chip.jpg é a vaca com chip no pescoço (p. 95) — não há foto de ordenha
   mecânica, então a parada "Hoje" fica sem foto.
   Regras TEA: 1 instrução por tela, sem cronômetro, aprendizagem sem erro —
   só a parada destacada avança; tocar fora de ordem só explica qual é a vez. */

const PARADAS = [
  /* ordenha.jpg é a ilustração da ordenha MANUAL (p. 94) — não é foto de robô */
  { ano: 'Há cem anos', foto: '../../img/hga/agr/ordenha.jpg',
    alt: 'Ilustração do livro: ordenhar as vacas à mão',
    frase: 'Há cem anos, a ordenha era só manual.',
    completo: 'O senhor Alfredo acordava muito cedo. Depois, juntava o gado e ordenhava as vacas.' },
  /* Hoje fica SEM foto: o acervo não tem imagem da ordenha mecânica */
  { ano: 'Hoje', foto: '',
    alt: '',
    frase: 'Hoje, cresceu a ordenha mecânica.',
    completo: 'Algumas fazendas ainda usam ordenha manual. Mas cresceu a ordenha mecânica.' },
  /* chip.jpg é a p. 95: vaca com chip no pescoço (não há foto de ordenha mecânica no acervo) */
  { ano: '2013', foto: '../../img/hga/agr/chip.jpg',
    alt: 'Vaca com um chip no pescoço',
    frase: 'Em 2013, chegou a ordenha com robôs.',
    completo: 'A vaca vai sozinha até a sala de ordenha. Ela é atraída pela ração no cocho. Um braço robótico tira o leite. O leite vai direto ao tanque.' }
];
const ID = 'tempo-leite';
const INSTRUCAO = 'Toque na parada destacada.';
const DICA = 'Toque na parada destacada.';
const CREDITOS = [
  'Ilustração da ordenha manual e foto da vaca com chip: livro do 3º ano, História e Geografia — p. 94 e 95 (uso escolar).',
  'Ícones: Twemoji, CC-BY 4.0.'
];

function boot () {
  'use strict';
  const K = window.JogoKit;
  const esc = K.esc;
  const app = document.getElementById('app');
  let S = { i: 0 };                       /* i = parada da vez (0..3) */

  /* ---------- pedaços de tela ---------- */
  function rodapeHtml () {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>';
  }

  function creditosHtml () {
    return '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      CREDITOS.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></details>';
  }

  function paradaHtml (p, k) {
    const feita = k < S.i, atual = k === S.i, vista = k <= S.i;
    return '<div class="parada' + (feita ? ' feita' : '') + (atual ? ' atual' : '') +
      '" data-i="' + k + '" role="button" tabindex="0" aria-label="' +
      esc(atual ? 'Parada de ' + p.ano + '. Toque aqui.' : 'Parada de ' + p.ano) + '">' +
      '<span class="ano">' + esc(p.ano) + '</span>' +
      (vista && p.foto ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.alt) + '">'
             : (p.foto ? '<span class="oculta" aria-hidden="true">?</span>' : '')) +
      (feita ? '<span class="marca" aria-hidden="true">✓</span>' : '') +
      (feita ? '<p class="frase">' + esc(p.frase) + '</p>' : '') +
      '</div>';
  }

  /* painel: a foto grande (quando há) e o texto completo da parada da vez — com áudio */
  function painelHtml () {
    const p = PARADAS[Math.min(S.i, PARADAS.length - 1)];
    const texto = p.ano + '. ' + p.frase + ' ' + p.completo;
    return '<section class="card painel" aria-live="polite">' +
      (p.foto ? '<img class="foto painel-foto" src="' + esc(p.foto) + '" alt="' + esc(p.alt) + '">' : '') +
      '<div class="texto">' +
        '<p class="ano">' + esc(p.ano) + '</p>' +
        '<p class="frase">' + esc(p.frase) + '</p>' +
        '<p class="completo">' + esc(p.completo) + '</p>' +
        '<fala-botoes texto="' + esc(texto) + '"></fala-botoes>' +
      '</div>' +
    '</section>';
  }

  /* ---------- telas ---------- */
  function render () {
    const n = PARADAS.length, i = S.i;
    app.innerHTML =
      '<h1 class="sr-only">O leite no tempo</h1>' +
      '<jogo-topo icone="🥛" titulo="O leite no tempo" contador="' + i + '/' + n +
        '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + n + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + esc(INSTRUCAO) + '"></fala-botoes>' +
        '<p class="hint">' + esc(DICA) + '</p>' +
        '<div class="trilha">' + PARADAS.map(paradaHtml).join('') + '</div>' +
        '<p class="feed" id="feed" aria-live="polite"></p>' +
      '</section>' +
      painelHtml() +
      rodapeHtml() + creditosHtml();

    app.querySelectorAll('.parada').forEach(el => {
      const k = +el.dataset.i;
      el.addEventListener('click', () => tocar(k));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocar(k); }
      });
    });
    window.scrollTo(0, 0);
  }

  function renderFim () {
    K.progresso.melhor(ID, PARADAS.length);
    app.innerHTML =
      '<h1 class="sr-only">O leite no tempo</h1>' +
      '<tela-fim icone="🥛" titulo="O leite no tempo" estrelas="3" total="3" ' +
        'resumo="Você visitou todas as paradas!" ' +
        'msg="Muito bem! Você viu a ordenha mudar no tempo."></tela-fim>' +
      '<section class="card">' +
        '<details class="detalhes" open><summary>O que é a ordenha</summary><ul>' +
          '<li>A retirada do leite das vacas e das cabras é a ordenha.</li>' +
          '<li>A ordenha com robôs acontece 24 horas por dia. Um chip no pescoço traz informações de cada animal.</li>' +
        '</ul></details>' +
      '</section>' +
      rodapeHtml() + creditosHtml();
    window.scrollTo(0, 0);
  }

  /* ---------- aviso curto na tela ---------- */
  function diz (txt, ok) {
    const f = app.querySelector('#feed');
    if (!f) return;
    f.textContent = txt;
    f.className = 'feed ' + (ok ? 'ok' : 'bad');
  }

  /* ---------- ação principal: tocar numa parada ---------- */
  function tocar (k) {
    if (k !== S.i) {                       /* fora de ordem: só explica qual é a vez */
      const ano = PARADAS[S.i].ano;
      diz('✗ Agora é a parada "' + ano + '".', false);
      K.falar('Agora é a parada ' + ano + '.', 0.85);
      return;
    }
    const p = PARADAS[S.i];
    S.i++;
    render();                              /* marca .feita, revela a próxima, tira o .atual */
    diz('✓ ' + p.frase, true);
    K.falar(p.frase, 0.85);
    if (S.i === PARADAS.length) setTimeout(renderFim, 700);
  }

  /* ---------- eventos dos componentes ---------- */
  app.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') { S = { i: 0 }; render(); }
    else if (acao === 'outros') { try { window.location.href = 'index.html'; } catch (err) {} }
  });
  app.addEventListener('voltar', () => { try { window.location.href = 'index.html'; } catch (err) {} });

  render();
}

/* Espera o kit e o <main> ficarem prontos (no navegador o kit já vem do <head>). */
(function espera (t) {
  if (window.JogoKit && document.getElementById('app')) { boot(); return; }
  if (t < 5000) setTimeout(() => espera(t + 25), 25);
})(0);
</script>
</body>
</html>
