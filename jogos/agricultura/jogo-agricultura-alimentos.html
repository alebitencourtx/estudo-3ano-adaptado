<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De onde vem a comida? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .prox{margin-top:16px}
  .apoio-fala{margin-top:14px}
  fichas-toque .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 🍚 De onde vem a comida? — agricultura, 2 rodadas de "toque nos certos".
     Base: livro p. 84, 85, 92 a 95. Vocabulário de resumos/agr-84-85-92-95.md.
     Componente do kit: <fichas-toque> (toca para marcar, "Conferir" revela ✓/✗
     e a resposta certa sempre aparece em .certa).
     Regras TEA: frases curtas, sem cronômetro, áudio do enunciado em cada rodada,
     "Conferir" só libera com o número certo de fichas marcadas. */

  const app = document.getElementById('app');
  const ID = 'agr-alimentos';
  const TOTAL = 2;
  const APOIO = 'O arroz e o feijão, as frutas e as verduras vêm da agricultura.';

  /* ícones das fichas (todos existem em ../../img/jogo/agr/) */
  const ICONES = {
    'Arroz': '../../img/jogo/agr/arroz.svg',
    'Feijão': '../../img/jogo/agr/feijao.svg',
    'Frutas': '../../img/jogo/agr/frutas.svg',
    'Verduras': '../../img/jogo/agr/verduras.svg',
    'Leite': '../../img/jogo/agr/leite.svg',
    'Ovos': '../../img/jogo/agr/ovos.svg',
    'Carne': '../../img/jogo/agr/carne.svg'
  };

  const RODADAS = [
    {
      pergunta: 'Toque nos 4 alimentos que vêm da agricultura.',
      hint: 'Toque em 4 fichas e depois em Conferir.',
      certas: ['Arroz', 'Feijão', 'Frutas', 'Verduras'],
      distratores: ['Leite', 'Ovos', 'Carne'],
      msg: 'O arroz, o feijão, as frutas e as verduras vêm da agricultura.'
    },
    {
      pergunta: 'Toque nos 3 alimentos que vêm da pecuária.',
      hint: 'Toque em 3 fichas e depois em Conferir.',
      certas: ['Leite', 'Ovos', 'Carne'],
      distratores: ['Arroz', 'Feijão'],
      msg: 'O leite, os ovos e a carne vêm dos animais.'
    }
  ];

  let i = 0;          // rodada da vez (0 ou 1)
  let acertos = 0;    // rodadas certas de primeira

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary>' +
      '<p>No campo, as pessoas trabalham na agricultura e na pecuária.</p><ul>' +
      '<li>Palavras do livro didático, p. 84, 85 e 92 a 95 (uso escolar).</li>' +
      '<li>Fotos do livro didático (uso escolar).</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* monta as fichas da rodada: as certas + os distratores, embaralhadas, com ícone */
  function fichasDa(r) {
    return JogoKit.embaralhar(r.certas.concat(r.distratores)).map(function (nome) {
      return ICONES[nome] ? { nome: nome, ico: ICONES[nome] } : nome;
    });
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🍚" titulo="De onde vem a comida?" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">' + JogoKit.esc(r.hint) + '</p>' +
        '<div data-toque></div>' +
        '<div class="apoio-fala"><fala-botoes texto="' + JogoKit.esc(APOIO) + '"></fala-botoes></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o "toque nos certos" é o componente do kit */
    const ft = document.createElement('fichas-toque');
    ft.montar({
      pergunta: r.pergunta,
      fichas: fichasDa(r),
      certas: r.certas,
      msg: r.msg
    });
    app.querySelector('[data-toque]').appendChild(ft);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    ft.addEventListener('conferido', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ Os certos são: ' + r.certas.join(', ') + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="🍚" titulo="De onde vem a comida?" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você acertou tudo!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
