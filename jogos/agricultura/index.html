<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agricultura — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
</head>
<body>
<main id="app"></main>
<script>
/* Pagina do topico "Agricultura" — gerada por _espec/gerar_menus.py. */
const JOGOS = [
  {arquivo:'../jogar.html?jogo=ordem-agr', icone:'🌾', nome:'Do leite ao queijo', como:'Ponha na ordem certa', oque:'Juntar o gado, ordenhar as vacas, fazer os queijos.', id:'ordem-agr'},
  {arquivo:'../jogar.html?jogo=agr-subsistencia', icone:'🌱', nome:'Subsistência ou comercial?', como:'Leve o cartão à caixa certa', oque:'Família e instrumentos simples × máquinas e venda.', id:'agr-subsistencia'},
  {arquivo:'../jogar.html?jogo=tempo-cana', icone:'🌾', nome:'A cana no tempo', como:'Passeie pelas paradas', oque:'1996, com facão; 2020, com máquinas; hoje, 9 em 10.', id:'tempo-cana'},
  {arquivo:'../jogar.html?jogo=agr-perguntas', icone:'🤖', nome:'Perguntas da agricultura', como:'Responda e veja a resposta', oque:'O meeiro, o robô na ordenha, o chip, açúcar e álcool.', id:'agr-perguntas'},
  {arquivo:'../jogar.html?jogo=mem-agr', icone:'🌾', nome:'Memória do campo', como:'Encontre os dois iguais', oque:'Arado, colheitadeira e ordenha.', id:'mem-agr'},
  {arquivo:'../jogar.html?jogo=tempo-leite', icone:'🥛', nome:'O leite no tempo', como:'Passeie pelas paradas', oque:'Há cem anos, hoje, 2013 com robôs.', id:'tempo-leite'},
  {arquivo:'../jogar.html?jogo=agr-alimentos', icone:'🍚', nome:'De onde vem a comida?', como:'Toque nos certos', oque:'Arroz, feijão, frutas e verduras.', id:'agr-alimentos'},
  {arquivo:'../jogar.html?jogo=agr-simnao', icone:'🌾', nome:'Sim ou não?', como:'Responda sim ou não', oque:'Subsistência, máquinas, cana e robô.', id:'agr-simnao'},
  {arquivo:'../jogar-3d.html?topico=agricultura', icone:'✨', nome:'Plantação 3D da Agricultura', como:'Explore o sítio e o campo em 3D', oque:'Subsistência e agricultura comercial com máquinas e canteiros 3D.', id:'agr-3d'},
];
const app = document.getElementById('app');
const prog = JogoKit.progresso.ler();
const legados = {};
['treino3ano.jogo.pec.v1', 'treino3ano.jogo.peca.v1'].forEach(function (k) {
  try { Object.keys(JSON.parse(localStorage.getItem(k) || '{}')).forEach(function (x) { legados[k + ':' + x] = 1; }); } catch (e) {}
});
function jogou(j) {
  if (j.id) return prog[j.id] !== undefined;
  if (j.legado) return Object.keys(legados).some(function (k) { return k.indexOf(j.legado + ':') === 0; });
  return false;
}
app.innerHTML = `
<header class="top">
  <h1><img class="fita" src="../../img/fita-autismo.png" alt=""> 🌾 Agricultura</h1>
  <p class="sub">p. 84, 85, 92, 95 · 9 jogos · base do livro</p>
  <p class="sub">Subsistência e comercial, instrumentos simples e máquinas, a cana no tempo e o leite do Sr. Alfredo.</p>
</header>
<section class="cards">
  ${JOGOS.map(j => `
  <article class="card fase">
    <span class="ico" aria-hidden="true">${j.icone}</span>
    <div class="txt">
      <h2>${JogoKit.esc(j.nome)}</h2>
      <p class="sub">${JogoKit.esc(j.como)}</p>
      <p class="sub">${JogoKit.esc(j.oque)}</p>
      ${jogou(j) ? '<p class="marca">✓ Você já jogou este.</p>' : ''}
    </div>
    <button type="button" class="btn jogar" data-ir="${JogoKit.esc(j.arquivo)}">Jogar</button>
  </article>`).join('')}
</section>
<p class="hint" style="text-align:center">Funciona no dedo (celular e tablet) e no mouse. Nenhum jogo tem cronômetro.</p>
<p class="rodape"><a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>
<details class="detalhes">
  <summary>Sobre estes jogos</summary>
  <ul>
    <li>Palavras e fatos só do livro (p. 84, 85, 92, 95).</li>
    <li>Sem cronômetro. Se errar, a resposta certa aparece e você pode tentar de novo.</li>
    <li>Use 🔊 Ouvir e 🐢 Devagar para ouvir. Sem voz no aparelho, peça a um adulto para ler.</li>
  </ul>
</details>`;
app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { location.href = b.dataset.ir; });

</script>
</body>
</html>
