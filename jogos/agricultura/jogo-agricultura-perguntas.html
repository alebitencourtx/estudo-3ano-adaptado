<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perguntas da agricultura — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  .apoio{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 🤖 Perguntas da agricultura — quiz de 4 rodadas, uma pergunta por tela.
     Base: livro p. 84, 85, 92, 93, 94 e 95. Vocabulário de resumos/agr-84-85-92-95.md.
     Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre aparece).
     Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio em cada rodada. */

  const app = document.getElementById('app');
  const ID = 'agr-perguntas';
  const TOTAL = 4;

  const RODADAS = [
    {
      pergunta: 'O que é o meeiro?',
      certa: 'Um agricultor que reparte a produção com o dono da terra',
      erradas: ['Um robô que tira o leite', 'Um instrumento simples'],
      msg: 'O meeiro reparte a produção.'
    },
    {
      pergunta: 'O que traz a vaca até a sala de ordenha com robôs?',
      certa: 'A ração no cocho',
      erradas: ['O facão', 'A enxada'],
      msg: 'A vaca vai sozinha, atraída pela ração.',
      img: '../../img/hga/agr/ordenha.jpg',
      alt: 'Vaca na sala de ordenha'
    },
    {
      pergunta: 'O que a cana vira?',
      certa: 'Açúcar e álcool',
      erradas: ['Leite e queijo', 'Cimento'],
      msg: 'A cana vira açúcar e álcool.',
      img: '../../img/hga/agr/cana-facao.jpg',
      alt: 'Colheita de cana com facão'
    },
    {
      pergunta: 'Para que serve o chip no pescoço da vaca?',
      certa: 'Traz informações de cada animal',
      erradas: ['Corta a cana', 'Faz o queijo'],
      msg: 'O chip informa cada animal.',
      img: '../../img/hga/agr/chip.jpg',
      alt: 'Chip no pescoço da vaca'
    }
  ];

  let i = 0;          // rodada da vez (0 a 3)
  let acertos = 0;    // acertos de primeira (a criança responde uma vez por rodada)

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Os 5 jogos</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      '<li>Fotos do livro didático, p. 92, 93, 94 e 95 (uso escolar).</li>' +
      '<li>Perguntas com palavras do livro (p. 84, 85, 92, 93, 94 e 95).</li>' +
      '<li>Ícones de emoji: Twemoji (CC BY 4.0).</li>' +
      '</ul></details>';
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🤖" titulo="Perguntas da agricultura" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">Toque na resposta.</p>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    /* o quiz em si é o componente do kit */
    const op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: r.pergunta,
      opcoes: JogoKit.embaralhar([r.certa].concat(r.erradas)),
      certa: r.certa,
      msg: r.msg
    });

    /* foto de apoio, quando houver: logo abaixo do enunciado e acima das opções */
    if (r.img) {
      const foto = document.createElement('img');
      foto.className = 'apoio';
      foto.src = r.img;
      foto.alt = r.alt || '';
      op.insertBefore(foto, op.querySelector('.opcoes'));
    }

    app.querySelector('[data-quiz]').appendChild(op);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);
    app.innerHTML =
      '<tela-fim icone="🤖" titulo="Perguntas da agricultura" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!"></tela-fim>' +
      rodape();
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else location.href = 'index.html';
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
