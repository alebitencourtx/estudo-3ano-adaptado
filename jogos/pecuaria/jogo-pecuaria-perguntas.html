<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perguntas da pecuária — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  /* ajustes locais do jogo "Perguntas da pecuária" (não altera o jogo-kit.css) */
  .foto-rodada{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:16px;
    border:2px solid var(--line);background:var(--acc-soft);margin:12px 0 0}
  .ico-rodada{display:block;width:112px;height:112px;object-fit:contain;margin:12px auto 0;
    border-radius:16px;border:2px solid var(--line);background:var(--acc-soft);padding:8px}
  .prox{margin-top:16px}
  opcoes-resposta .feed{text-align:left}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  'use strict';

  /* 🎯 Perguntas da pecuária — quiz de 5 rodadas, uma pergunta por tela.
     Conteúdo fechado: resumos/pec-86-87.md (livro p. 86 e 87): pecuária extensiva
     (solto, pastagens) × intensiva (confinado, estábulo, ordenha), carnes e couro.
     Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre
     aparece e a errada fica marcada).
     Regras TEA: frases curtas (≤ 10 palavras), 2 opções do livro, sem cronômetro,
     áudio do enunciado e da resposta, "Próxima" só depois de responder. */

  var app = document.getElementById('app');
  var ID = 'pec-perguntas';
  var TOTAL = 7;

  var DICA = 'Toque na resposta. Ou ouça com 🔊.';

  /* foto (rodadas 1 e 2) ou ícone (rodadas 4 e 5); na tela as 2 opções saem embaralhadas */
  var RODADAS = [
    {
      pergunta: 'O que é pecuária?',
      certa: 'Criação e reprodução de animais',
      errada: 'Plantio ou colheita',
      msg: 'Pecuária é a criação e a reprodução de animais.'
    },
    {
      pergunta: 'Que importância a pecuária tem no Brasil?',
      certa: 'É uma atividade econômica importante',
      errada: 'É um trabalhador volante',
      msg: 'A pecuária é uma atividade econômica importante no Brasil.'
    },
    {
      foto: '../../img/hga/pec/pasto.jpg',
      alt: 'Gado solto no pasto',
      pergunta: 'Na pecuária extensiva, onde o gado come?',
      certa: 'Nas pastagens',
      errada: 'No estábulo',
      msg: 'Na extensiva, o gado come nas pastagens.'
    },
    {
      foto: '../../img/hga/pec/curral.jpg',
      alt: 'Gado confinado no curral',
      pergunta: 'Na pecuária intensiva, como o gado fica?',
      certa: 'Confinado no curral',
      errada: 'Solto no pasto',
      msg: 'Na intensiva, o gado fica confinado.'
    },
    {
      pergunta: 'Onde o gado recebe alimentação específica na intensiva?',
      certa: 'No estábulo',
      errada: 'Nas pastagens',
      msg: 'No estábulo, o gado recebe alimentação específica.'
    },
    {
      ico: '../../img/jogo/pec/emoji/leite.svg',
      alt: 'Leite',
      pergunta: 'O que se tira do gado na ordenha?',
      certa: 'O leite',
      errada: 'O couro',
      msg: 'A ordenha retira o leite.'
    },
    {
      pergunta: 'Como pode ser feita a ordenha na pecuária intensiva?',
      certa: 'Por ordenha mecânica',
      errada: 'Nas pastagens',
      msg: 'Na intensiva, a retirada do leite pode ser feita por ordenha mecânica.'
    }
  ];

  var LEMBRETE = 'Por meio da pecuária obtemos leite, carnes, ovos e couro.';
  var CREDITOS = [
    'Fotos do livro do 3º ano, p. 86 e 87 (gado solto no pasto e gado confinado no curral).',
    'Ícone de emoji (leite): Twemoji, CC-BY 4.0.'
  ];

  var i = 0;          /* rodada da vez (0 a 6) */
  var acertos = 0;    /* acertos de primeira (uma resposta por rodada) */

  /* ---------- pedaços de tela ---------- */
  function rodape() {
    return '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
      '<details class="detalhes"><summary>Créditos das imagens</summary>' +
      '<p>' + JogoKit.esc(LEMBRETE) + '</p><ul>' +
      CREDITOS.map(function (c) { return '<li>' + JogoKit.esc(c) + '</li>'; }).join('') +
      '</ul></details>';
  }

  /* componentes web criados por innerHTML: garante que já renderizaram */
  function montarComponentes() {
    app.querySelectorAll('jogo-topo,barra-progresso,tela-fim').forEach(function (el) {
      if (!el.firstElementChild && typeof el.connectedCallback === 'function') el.connectedCallback();
    });
  }

  /* <jogo-topo> e <tela-fim> desenham o título no componente; a tela precisa de 1 <h1>.
     Troca só a tag, mantendo classe e estilo: a aparência não muda. */
  function tituloH1() {
    var el = app.querySelector('.fase-nome');
    if (!el || el.tagName === 'H1') return;
    var h1 = document.createElement('h1');
    h1.className = el.className;
    if (el.getAttribute('style')) h1.setAttribute('style', el.getAttribute('style'));
    h1.textContent = el.textContent;
    el.parentNode.replaceChild(h1, el);
  }

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    var r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🎯" titulo="Perguntas da pecuária" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + JogoKit.esc(r.pergunta) + '"></fala-botoes>' +
        '<p class="hint">' + JogoKit.esc(DICA) + '</p>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape();

    montarComponentes();
    tituloH1();

    /* o quiz em si é o componente do kit; a certa vai pelo TEXTO
       (embaralhada: a resposta certa não fica sempre no mesmo lugar) */
    var op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: r.pergunta,
      opcoes: JogoKit.embaralhar([r.certa, r.errada]),
      certa: r.certa,
      msg: r.msg
    });

    /* apoio visual no enunciado: a foto do livro ou o ícone, antes das opções */
    var img = document.createElement('img');
    if (r.foto) {
      img.className = 'foto-rodada';
      img.src = r.foto;
      img.alt = r.alt || '';
      op.insertBefore(img, op.querySelector('.opcoes'));
    } else if (r.ico) {
      img.className = 'ico-rodada';
      img.src = r.ico;
      img.alt = r.alt || '';
      op.insertBefore(img, op.querySelector('.opcoes'));
    }

    app.querySelector('[data-quiz]').appendChild(op);

    var prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      var ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      var barra = app.querySelector('barra-progresso');
      if (barra) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg));
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID, acertos);      /* melhor = acertos de primeira */
    var msg = acertos === TOTAL
      ? 'Muito bem! Você acertou tudo de primeira.'
      : 'Você acertou ' + acertos + ' de ' + TOTAL + '. Pode jogar de novo.';
    app.innerHTML =
      '<tela-fim icone="🎯" titulo="Perguntas da pecuária" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!" msg="' + JogoKit.esc(msg) + '"></tela-fim>' +
      rodape();
    montarComponentes();
    tituloH1();
    JogoKit.falar('Você acertou ' + acertos + ' de ' + TOTAL + '.');
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    var acao = e.detail && e.detail.acao;
    if (acao === 'denovo') { montar(); }
    else if (acao === 'outros') { location.href = 'index.html'; }
  });
  document.addEventListener('voltar', function () {
    location.href = 'index.html';
  });

  montar();
})();
</script>
</body>
</html>
