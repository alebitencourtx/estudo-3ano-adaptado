<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O trabalhador volante — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>   <!-- clássico, no head: define os componentes antes do corpo -->
<style>
/* ===== ajustes locais do jogo "O trabalhador volante" (não altera o jogo-kit.css) =====
   Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio do enunciado em cada rodada.
   O ícone do trabalhador volante fica AO LADO do enunciado (apoio visual + áudio). */
.enun{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.enun .pergunta{margin:0;flex:1 1 auto}
.enun .apoio-ico{width:76px;height:76px;max-height:76px;flex:none;object-fit:contain;
  border-radius:14px;border:2px solid var(--line);background:var(--acc-soft);padding:4px}
.prox{margin-top:16px}
opcoes-resposta .feed{text-align:left}
@media (max-width:430px){
  .enun .apoio-ico{width:56px;height:56px;max-height:56px}
  .enun{gap:8px}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== O trabalhador volante — quiz de 5 rodadas, uma pergunta por tela (pecuária, p. 86, 87) =====
   Conteúdo do livro (lista fechada em resumos/pec-86-87.md):
     trabalhador volante / boia-fria → plantio ou colheita por um tempo determinado;
     vive nas cidades próximas; é transportado de ônibus ou de caminhão.
   Componente do kit: <opcoes-resposta> (feedback imediato; a resposta certa sempre aparece).
   Regras TEA: frases curtas, 3 opções, sem cronômetro, áudio do enunciado em cada rodada,
   botão "Próxima" liberado só depois de responder, contador X/4 + barra de progresso. */
(function () {
  'use strict';
  const esc = JogoKit.esc;

  const ID_PROG = 'pec-volante';
  const TOTAL = 5;

  const APOIO = 'O trabalhador volante faz plantio ou colheita por um tempo determinado.';
  const DICA = 'Leia a pergunta e toque na resposta. Ou ouça com 🔊.';

  const RODADAS = [
    {
      pergunta: 'Que outro nome o livro dá ao trabalhador volante?',
      certa: 'Boia-fria',
      erradas: ['Administrador', 'Arrendatário'],
      msg: 'O trabalhador volante também é chamado boia-fria.',
      img: '../../img/jogo/pec/volante.svg',
      alt: 'Trabalhador volante do campo'
    },
    {
      pergunta: 'O que o trabalhador volante faz?',
      certa: 'Plantio ou colheita por um tempo',
      erradas: ['Organiza as atividades', 'Aluga parte da terra'],
      msg: 'Ele faz plantio ou colheita por um tempo.'
    },
    {
      pergunta: 'Onde muitos trabalhadores volantes vivem?',
      certa: 'Nas cidades próximas',
      erradas: ['Nas pastagens', 'No estábulo'],
      msg: 'Muitos vivem nas cidades próximas.'
    },
    {
      pergunta: 'Como o trabalhador volante é levado até o trabalho?',
      certa: 'De ônibus ou de caminhão',
      erradas: ['No plantio', 'Na colheita'],
      msg: 'Eles são transportados de ônibus ou de caminhão.'
    },
    {
      pergunta: 'Como são as condições de trabalho de alguns trabalhadores do campo?',
      certa: 'Sem equipamentos adequados, por longo período e com baixa remuneração',
      erradas: ['Recebendo um salário', 'Dividindo parte da produção'],
      msg: 'Alguns trabalham sem equipamentos adequados, por um longo período e com baixa remuneração.'
    }
  ];

  const CREDITOS = [
    'Ícones de emoji: Twemoji (CC BY 4.0).',
    'Conteúdo e fotos: livro didático do 3º ano, páginas 86 e 87 (uso escolar).'
  ];
  const FECHAMENTO = 'Nem todos os trabalhadores do campo têm boas condições de trabalho: ' +
    'alguns trabalham sem equipamentos adequados, por um longo período e com baixa remuneração.';

  const rodape =
    '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>' +
    '<details class="detalhes"><summary>Créditos das imagens</summary><ul>' +
      CREDITOS.map(c => '<li>' + esc(c) + '</li>').join('') +
    '</ul><p>' + esc(FECHAMENTO) + '</p></details>';

  const app = document.getElementById('app');
  let i = 0;          /* rodada da vez (0 a 4) */
  let acertos = 0;    /* acertos de primeira (uma resposta por rodada) */

  /* ---------- telas ---------- */
  function montar() {
    i = 0;
    acertos = 0;
    rodada();
  }

  function rodada() {
    const r = RODADAS[i];

    app.innerHTML =
      '<jogo-topo icone="🛻" titulo="O trabalhador volante" contador="' + (i + 1) + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
      '<barra-progresso valor="' + i + '" total="' + TOTAL + '"></barra-progresso>' +
      '<section class="card">' +
        '<fala-botoes texto="' + esc(APOIO) + '"></fala-botoes>' +
        '<p class="hint">' + esc(DICA) + '</p>' +
        '<fala-botoes texto="' + esc(r.pergunta) + '"></fala-botoes>' +
        '<div data-quiz></div>' +
        '<button type="button" class="btn prox escondido" data-prox>Próxima →</button>' +
      '</section>' +
      rodape;

    /* o quiz em si é o componente do kit */
    const op = document.createElement('opcoes-resposta');
    op.montar({
      pergunta: r.pergunta,
      opcoes: JogoKit.embaralhar([r.certa].concat(r.erradas)),
      certa: r.certa,
      msg: r.msg
    });

    /* ícone de apoio AO LADO do enunciado (rodada 1, quando houver) */
    if (r.img) {
      const p = op.querySelector('.pergunta');
      const linha = document.createElement('div');
      linha.className = 'enun';
      const ico = document.createElement('img');
      ico.className = 'apoio-ico';
      ico.src = r.img;
      ico.alt = r.alt || '';
      op.insertBefore(linha, p);
      linha.appendChild(ico);
      linha.appendChild(p);
    }

    app.querySelector('[data-quiz]').appendChild(op);

    const prox = app.querySelector('[data-prox]');
    prox.onclick = proxima;

    op.addEventListener('resposta', function (e) {
      const ok = !!(e.detail && e.detail.ok);
      if (ok) acertos++;
      prox.classList.remove('escondido');
      const barra = app.querySelector('barra-progresso');
      if (barra && barra.atualizar) barra.atualizar(i + 1, TOTAL);
      JogoKit.falar(ok ? ('✓ ' + r.msg) : ('✗ A resposta certa é: ' + r.certa + '. ' + r.msg), 0.85);
    });

    subir();
  }

  function proxima() {
    if (i + 1 < TOTAL) {
      i++;
      rodada();
    } else {
      terminar();
    }
  }

  function terminar() {
    JogoKit.progresso.melhor(ID_PROG, acertos);   /* recorde = acertos de primeira */
    app.innerHTML =
      '<tela-fim icone="🛻" titulo="O trabalhador volante" estrelas="' + acertos + '" total="' + TOTAL + '"' +
        ' resumo="Você respondeu tudo!"></tela-fim>' +
      rodape;
    subir();
  }

  function subir() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function ir(url) { try { location.href = url; } catch (e) {} }

  /* ---------- eventos dos componentes ---------- */
  document.addEventListener('fim', function (e) {
    if (e.detail && e.detail.acao === 'denovo') montar();
    else ir('index.html');
  });
  document.addEventListener('voltar', function () { ir('index.html'); });

  montar();
})();
</script>
</body>
</html>
