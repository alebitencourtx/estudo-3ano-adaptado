<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solto ou confinado? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  jogo-topo,barra-progresso,tela-fim{display:block}
  /* cartões só de texto: o JogoKit.pecaHtml nasce com um <img> (aqui vazio) — esconda-o */
  .peca > img{display:none}
  /* no texto, o nome do cartão continua visível depois de encaixado */
  .peca .nome{font-size:.95rem;max-width:12em;text-align:center;line-height:1.2}
  .peca.encaixada .nome{display:block}
  .peca.encaixada{padding:6px 8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Solto ou confinado? (pecuária, livro p. 86, 87) =====
   Classificar 8 cartões em 2 caixas: pecuária extensiva × intensiva.
   Três rodadas, com até 3 cartões por tela; o contador continua somando os 8.
   Dois modos: arrastar (dedo e mouse) e tocar.
   Regras TEA: 1 instrução, 2 destinos, até 3 peças por tela,
   sem cronômetro, erro sem punição — diz onde vai o cartão e mostra a frase
   certa; a peça continua selecionada.
   Fotos: livro do 3º ano, p. 86 e 87. Emojis: Twemoji (CC-BY 4.0). */

const ID = 'pec-criacao';
const TOTAL = 8;                     /* 8 cartões, em 3 rodadas de até 3 */
const POR_RODADA = 3;
const ICO_VAZIO = 'data:,';          /* evita o <img src=""> do pecaHtml (não pede a página) */

const ALVOS = [
  { id: 'extensiva', nome: 'Extensiva', foto: '../../img/hga/pec/pasto.jpg',  alt: 'Gado criado solto no pasto em Rio Rufino, Santa Catarina' },
  { id: 'intensiva', nome: 'Intensiva', foto: '../../img/hga/pec/curral.jpg', alt: 'Gado criado confinado em curral em Itaobim, Minas Gerais' }
];

const PECAS = [
  { id: 'solto',     alvo: 'extensiva', ico: ICO_VAZIO, nome: 'Solto em grandes áreas',                  msg: 'Na extensiva, o gado fica solto.' },
  { id: 'pastagens', alvo: 'extensiva', ico: ICO_VAZIO, nome: 'Come nas pastagens',                      msg: 'Na extensiva, o gado come nas pastagens.' },
  { id: 'poucos',    alvo: 'extensiva', ico: ICO_VAZIO, nome: 'Poucos trabalhadores',                    msg: 'Na extensiva, poucos trabalhadores cuidam do gado.' },
  { id: 'confinado', alvo: 'intensiva', ico: ICO_VAZIO, nome: 'Confinado',                               msg: 'Na intensiva, o gado fica confinado. Confinado quer dizer mantido em ambiente cercado.' },
  { id: 'sem-grande-area', alvo: 'intensiva', ico: ICO_VAZIO, nome: 'Não precisa de grandes extensões de terra', msg: 'Na intensiva, não são necessárias grandes extensões de terra.' },
  { id: 'estabulo',  alvo: 'intensiva', ico: ICO_VAZIO, nome: 'Alimentação específica no estábulo', msg: 'No estábulo, área coberta onde o gado fica abrigado, ele recebe alimentação específica.' },
  { id: 'ordenha',   alvo: 'intensiva', ico: ICO_VAZIO, nome: 'Ordenha mecânica', msg: 'A retirada de leite pode ser feita por ordenha mecânica.' },
  { id: 'mais',      alvo: 'intensiva', ico: ICO_VAZIO, nome: 'Mais trabalhadores',                      msg: 'Na intensiva, é necessário um número maior de trabalhadores.' }
];

/* 3 rodadas de até 3 cartões (cada rodada tem as 2 caixas) */
const RODADAS = [
  ['solto', 'pastagens', 'confinado'],
  ['poucos', 'sem-grande-area', 'estabulo'],
  ['ordenha', 'mais']
];

const APOIO = 'Na extensiva o gado vive solto. Na intensiva o gado fica no estábulo.';
const HINT = 'Arraste o cartão. Ou toque nele e na caixa.';

const CREDITOS = [
  'Fotos de pasto e de curral: livro do 3º ano, p. 86 e 87.',
  'Emojis e ícones: Twemoji, CC-BY 4.0.'
];

const RODAPE = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
  + CREDITOS.map(c => '<li>' + JogoKit.esc(c) + '</li>').join('')
  + '</ul></details>';

const app = document.getElementById('app');
let rodada = 0;                     /* rodada da vez (0 e 1) */
let S = null;                       /* { colocadas, naRodada, primeiras } */

/* componentes web criados por innerHTML: garante que já renderizaram */
function montarComponentes() {
  app.querySelectorAll('jogo-topo,barra-progresso,tela-fim').forEach(el => {
    if (!el.firstElementChild && typeof el.connectedCallback === 'function') el.connectedCallback();
  });
}

function atualizar() {
  const cont = app.querySelector('jogo-topo [data-contador]');
  if (cont) cont.textContent = S.colocadas + '/' + TOTAL;
  const bar = app.querySelector('barra-progresso');
  if (bar) {
    if (!bar.querySelector('.bar') && typeof bar.render === 'function') bar.render();
    if (typeof bar.atualizar === 'function') bar.atualizar(S.colocadas, TOTAL);
  }
}

function diz(texto, ok) {
  const f = app.querySelector('#feed');
  if (!f) return;
  f.textContent = texto;
  f.className = 'feed ' + (ok ? 'ok' : 'bad');
}

function pulso(el) {
  el.classList.add('pulso');
  setTimeout(() => el.classList.remove('pulso'), 1400);
}

const nomeDoAlvo = id => (ALVOS.filter(a => a.id === id)[0] || {}).nome || '';

/* ---------- uma rodada: até 3 cartões na bandeja ---------- */
function renderJogo() {
  rodada = 0;
  S = { colocadas: 0, naRodada: 0, primeiras: 0 };
  renderRodada();
}

function renderRodada() {
  JogoKit.arrasto.limpar();
  S.naRodada = 0;
  const pecas = JogoKit.embaralhar(RODADAS[rodada].map(id => PECAS.filter(p => p.id === id)[0]));

  app.innerHTML =
    '<h1 class="sr-only">Solto ou confinado?</h1>'
    + '<jogo-topo icone="🐄" titulo="Solto ou confinado?" contador="' + S.colocadas + '/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>'
    + '<barra-progresso valor="' + S.colocadas + '" total="' + TOTAL + '"></barra-progresso>'
    + '<section class="card">'
      + '<p class="pergunta">Coloque cada cartão na caixa: Extensiva ou Intensiva.</p>'
      + '<fala-botoes texto="' + JogoKit.esc(APOIO) + '"></fala-botoes>'
      + '<p class="hint">' + JogoKit.esc(HINT) + '</p>'
      + '<div class="alvos" id="alvos" style="margin-top:16px">'
        + ALVOS.map(a =>
            '<div class="alvo" data-id="' + a.id + '" role="button" tabindex="0" aria-label="' + JogoKit.esc(a.nome) + '">'
            + '<img class="foto" src="' + JogoKit.esc(a.foto) + '" alt="' + JogoKit.esc(a.alt) + '">'
            + '<span class="nome">' + JogoKit.esc(a.nome) + '</span>'
            + '<span class="encaixados"></span>'
          + '</div>').join('')
      + '</div>'
      + '<div class="bandeja" id="bandeja">'
        + pecas.map(p => JogoKit.pecaHtml(p)).join('')
      + '</div>'
      + '<p class="feed" id="feed" aria-live="polite"></p>'
    + '</section>'
    + RODAPE;

  montarComponentes();
  atualizar();

  const topo = app.querySelector('jogo-topo');
  if (topo) topo.addEventListener('voltar', () => { location.href = 'index.html'; });

  app.querySelectorAll('.peca').forEach(peca => JogoKit.arrasto.ligar(peca, soltar, falarNome));
  app.querySelectorAll('.alvo').forEach(alvo => JogoKit.arrasto.ligarAlvo(alvo, soltar));
  window.scrollTo(0, 0);
}

function falarNome(peca) {
  if (!peca) return;
  const n = peca.querySelector('.nome');
  if (n) JogoKit.falar(n.textContent, 0.85);
}

/* ---------- soltar o cartão: certo ou errado ---------- */
function soltar(peca, alvo) {
  if (!peca || !alvo || peca.dataset.feita) return;
  const certo = peca.dataset.alvo === alvo.dataset.id;
  const tent = +peca.dataset.tent || 0;

  if (certo) {
    peca.dataset.feita = '1';
    if (tent === 0) S.primeiras++;
    peca.classList.add('encaixada');
    const caixa = alvo.querySelector('.encaixados');
    if (caixa) caixa.appendChild(peca);
    JogoKit.arrasto.limpar();
    S.colocadas++;
    S.naRodada++;
    diz('✓ ' + peca.dataset.msg, true);
    JogoKit.falar(peca.dataset.msg, 0.85);
    atualizar();
    if (S.colocadas === TOTAL) setTimeout(renderFim, 900);
    else if (S.naRodada === POR_RODADA) setTimeout(proximaRodada, 1500);
  } else {
    peca.dataset.tent = tent + 1;
    /* erro diz ONDE vai o cartão (nome da caixa) + a frase certa do livro */
    const certoAviso = 'Vai na caixa ' + nomeDoAlvo(peca.dataset.alvo) + '. ' + peca.dataset.msg;
    diz('✗ ' + certoAviso, false);
    JogoKit.falar(certoAviso, 0.85);
    pulso(peca);
    /* a peça continua selecionada: é só tocar na caixa certa de novo */
    const bom = app.querySelector('.alvo[data-id="' + peca.dataset.alvo + '"]');
    if (bom) {
      bom.classList.add('brilho');
      setTimeout(() => bom.classList.remove('brilho'), 2200);
    }
  }
}

function proximaRodada() {
  rodada++;
  renderRodada();
}

/* ---------- tela final ---------- */
function renderFim() {
  JogoKit.arrasto.limpar();
  const a = S.primeiras, n = TOTAL;
  JogoKit.progresso.melhor(ID, a);
  const estrelas = Math.max(1, a);              /* nunca termina com 0 estrela */
  const msg = a === n ? 'Você acertou tudo de primeira! Muito bem!'
    : (a === n - 1 ? 'Muito bem! Quase tudo de primeira.'
    : 'Você acertou ' + a + ' de ' + n + ' de primeira. Pode jogar de novo.');

  app.innerHTML =
    '<h1 class="sr-only">Solto ou confinado?</h1>'
    + '<tela-fim icone="🐄" titulo="Solto ou confinado?" estrelas="' + estrelas + '" total="' + n + '"'
    + ' resumo="Tudo no lugar!" msg="' + JogoKit.esc(msg) + '"></tela-fim>'
    + RODAPE;

  montarComponentes();

  const tf = app.querySelector('tela-fim');
  if (tf) tf.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();
    else location.href = 'index.html';
  });

  JogoKit.falar('Tudo no lugar! Você acertou ' + a + ' de ' + n + ' de primeira.', 0.85);
  window.scrollTo(0, 0);
}

renderJogo();
</script>
</body>
</html>
