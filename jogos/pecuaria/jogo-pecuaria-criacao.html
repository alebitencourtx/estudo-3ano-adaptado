<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solto ou confinado? — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
  jogo-topo,barra-progresso,tela-fim{display:block}
  /* cartões só de texto: o JogoKit.pecaHtml nasce com um <img> vazio — esconda-o */
  .peca > img[src=""]{display:none}
  /* no texto, o nome do cartão continua visível depois de encaixado */
  .peca .nome{font-size:.95rem;max-width:12em;text-align:center;line-height:1.2}
  .peca.encaixada .nome{display:block}
  .peca.encaixada{padding:6px 8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Solto ou confinado? (pecuária, livro p. 86, 87) =====
   Classificar 6 cartões em 2 caixas: pecuária extensiva × intensiva.
   Dois modos: arrastar (dedo e mouse) e tocar (cartão e depois a caixa).
   Regras TEA: 1 instrução, 2 destinos, frases curtas (≤ 10 palavras),
   sem cronômetro, erro sem punição — mostra a resposta certa e destaca
   a caixa certa; a peça continua selecionada.
   Fotos: livro do 3º ano, p. 86 e 87. Emojis: Twemoji (CC-BY 4.0). */

const ID = 'pec-criacao';
const TOTAL = 6;

const ALVOS = [
  { id: 'extensiva', nome: 'Extensiva', foto: '../../img/hga/pec/pasto.jpg',  alt: 'Gado solto no pasto' },
  { id: 'intensiva', nome: 'Intensiva', foto: '../../img/hga/pec/curral.jpg', alt: 'Gado confinado no curral' }
];

const PECAS = [
  { id: 'solto',     alvo: 'extensiva', nome: 'Solto em grandes áreas',                  msg: 'Na extensiva, o gado fica solto.' },
  { id: 'pastagens', alvo: 'extensiva', nome: 'Come nas pastagens',                      msg: 'Na extensiva, o gado come nas pastagens.' },
  { id: 'poucos',    alvo: 'extensiva', nome: 'Poucos trabalhadores',                    msg: 'Na extensiva, poucos trabalhadores cuidam do gado.' },
  { id: 'confinado', alvo: 'intensiva', nome: 'Confinado',                               msg: 'Na intensiva, o gado fica confinado.' },
  { id: 'estabulo',  alvo: 'intensiva', nome: 'Come alimentação específica no estábulo', msg: 'Na intensiva, o gado come no estábulo.' },
  { id: 'mais',      alvo: 'intensiva', nome: 'Mais trabalhadores',                      msg: 'Na intensiva, mais trabalhadores cuidam do gado.' }
];

const CREDITOS = [
  'Fotos de pasto e de curral: livro do 3º ano, p. 86 e 87.',
  'Emojis e ícones: Twemoji, CC-BY 4.0.'
];

const RODAPE = '<p class="rodape"><a href="index.html">← Os 5 jogos</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
  + CREDITOS.map(c => '<li>' + JogoKit.esc(c) + '</li>').join('')
  + '</ul></details>';

const app = document.getElementById('app');
let S = null;                       /* { colocadas, primeiras } */

/* componentes web criados por innerHTML: garante que já renderizaram */
function montarComponentes() {
  app.querySelectorAll('jogo-topo,barra-progresso,tela-fim').forEach(el => {
    if (!el.firstElementChild && typeof el.connectedCallback === 'function') el.connectedCallback();
  });
}

function atualizar() {
  const cont = app.querySelector('jogo-topo [data-contador]');
  if (cont) cont.textContent = S.colocadas + '/' + TOTAL;
  const bar = app.querySelector('barra-progresso');
  if (bar) {
    if (!bar.querySelector('.bar') && typeof bar.render === 'function') bar.render();
    if (typeof bar.atualizar === 'function') bar.atualizar(S.colocadas, TOTAL);
  }
}

function diz(texto, ok) {
  const f = app.querySelector('#feed');
  if (!f) return;
  f.textContent = texto;
  f.className = 'feed ' + (ok ? 'ok' : 'bad');
}

function pulso(el) {
  el.classList.add('pulso');
  setTimeout(() => el.classList.remove('pulso'), 1400);
}

/* ---------- tela do jogo ---------- */
function renderJogo() {
  JogoKit.arrasto.limpar();
  S = { colocadas: 0, primeiras: 0 };
  const pecas = JogoKit.embaralhar(PECAS);

  app.innerHTML =
    '<jogo-topo icone="🐄" titulo="Solto ou confinado?" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>'
    + '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>'
    + '<section class="card">'
      + '<p class="pergunta">Coloque cada cartão na caixa certa.</p>'
      + '<fala-botoes texto="Na extensiva o gado vive solto. Na intensiva o gado fica no estábulo."></fala-botoes>'
      + '<p class="hint">Arraste o cartão para a caixa. Ou toque no cartão e depois na caixa.</p>'
      + '<div class="alvos" id="alvos" style="margin-top:16px">'
        + ALVOS.map(a =>
            '<div class="alvo" data-id="' + a.id + '" role="button" tabindex="0" aria-label="' + JogoKit.esc(a.nome) + '">'
            + '<img class="foto" src="' + JogoKit.esc(a.foto) + '" alt="' + JogoKit.esc(a.alt) + '">'
            + '<span class="nome">' + JogoKit.esc(a.nome) + '</span>'
            + '<span class="encaixados"></span>'
          + '</div>').join('')
      + '</div>'
      + '<div class="bandeja" id="bandeja">'
        + pecas.map(p => JogoKit.pecaHtml(p)).join('')
      + '</div>'
      + '<p class="feed" id="feed" aria-live="polite"></p>'
    + '</section>'
    + RODAPE;

  montarComponentes();
  atualizar();

  const topo = app.querySelector('jogo-topo');
  if (topo) topo.addEventListener('voltar', () => { location.href = 'index.html'; });

  app.querySelectorAll('.peca').forEach(peca => JogoKit.arrasto.ligar(peca, soltar, falarNome));
  app.querySelectorAll('.alvo').forEach(alvo => JogoKit.arrasto.ligarAlvo(alvo, soltar));
  window.scrollTo(0, 0);
}

function falarNome(peca) {
  if (!peca) return;
  const n = peca.querySelector('.nome');
  if (n) JogoKit.falar(n.textContent, 0.85);
}

/* ---------- soltar o cartão: certo ou errado ---------- */
function soltar(peca, alvo) {
  if (!peca || !alvo || peca.dataset.feita) return;
  const certo = peca.dataset.alvo === alvo.dataset.id;
  const tent = +peca.dataset.tent || 0;

  if (certo) {
    peca.dataset.feita = '1';
    if (tent === 0) S.primeiras++;
    peca.classList.add('encaixada');
    const caixa = alvo.querySelector('.encaixados');
    if (caixa) caixa.appendChild(peca);
    JogoKit.arrasto.limpar();
    S.colocadas++;
    diz('✓ ' + peca.dataset.msg, true);
    JogoKit.falar(peca.dataset.msg, 0.85);
    atualizar();
    if (S.colocadas === TOTAL) setTimeout(renderFim, 900);
  } else {
    peca.dataset.tent = tent + 1;
    diz('✗ ' + peca.dataset.msg, false);
    JogoKit.falar(peca.dataset.msg, 0.85);
    pulso(peca);
    /* a peça continua selecionada: é só tocar na caixa certa de novo */
    const bom = app.querySelector('.alvo[data-id="' + peca.dataset.alvo + '"]');
    if (bom) {
      bom.classList.add('brilho');
      setTimeout(() => bom.classList.remove('brilho'), 2200);
    }
  }
}

/* ---------- tela final ---------- */
function renderFim() {
  JogoKit.arrasto.limpar();
  const a = S.primeiras, n = TOTAL;
  JogoKit.progresso.melhor(ID, a);
  const msg = a === n ? 'Você acertou tudo de primeira! Muito bem!'
    : (a === n - 1 ? 'Muito bem! Quase tudo de primeira.'
    : 'Você acertou ' + a + ' de ' + n + ' de primeira. Pode jogar de novo.');

  app.innerHTML =
    '<tela-fim icone="🐄" titulo="Solto ou confinado?" estrelas="' + a + '" total="' + n + '"'
    + ' resumo="Tudo no lugar!" msg="' + JogoKit.esc(msg) + '"></tela-fim>'
    + RODAPE;

  montarComponentes();

  const tf = app.querySelector('tela-fim');
  if (tf) tf.addEventListener('fim', e => {
    const acao = e.detail && e.detail.acao;
    if (acao === 'denovo') renderJogo();
    else location.href = 'index.html';
  });

  JogoKit.falar('Tudo no lugar! Você acertou ' + a + ' de ' + n + ' de primeira.', 0.85);
  window.scrollTo(0, 0);
}

renderJogo();
</script>
</body>
</html>
