<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jogo da Pecuária — Arrasta e solta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Jogo da Pecuária — ARRASTA E SOLTA (p. 86, 87) =====
   Mesma linguagem visual do treino. Funciona com dedo (touch) e mouse.
   Regras TEA: instrução curta, 3-4 peças, sem cronômetro, sem erro punido —
   a resposta certa aparece e a criança tenta de novo. */
:root{
  --font-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --paper:#EEF3FB; --grid:#DCE5F4; --card:#FFFFFF; --ink:#18264A; --muted:#55628A; --line:#CBD6EC;
  --ok:#16794F; --ok-soft:#DDF4E8; --bad:#B63030; --bad-soft:#FBE4E4; --focus:#2A55C4; --star:#E09A00;
  --on-acc:#FFFFFF;
  --hg:#965F10; --hg-soft:#FBEED2;
  --acc:var(--hg); --acc-soft:var(--hg-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1730; --grid:#17213F; --card:#18223F; --ink:#E9EEFB; --muted:#A5B1D2; --line:#2B3963;
  --ok:#58D39B; --ok-soft:#153A2B; --bad:#FF8F8F; --bad-soft:#44202A; --focus:#8FB0FF; --star:#FFC83D; --on-acc:#0E1530;
  --hg:#F2B650; --hg-soft:#3B2F14; color-scheme:dark}}
:root[data-skin="rosa"]{
  --paper:#FFF4F8; --grid:#FBE1EB; --card:#FFFFFF; --ink:#4A1D3A; --muted:#85556F; --line:#F2C9DA;
  --focus:#C2255C; --star:#F7BC1D; --on-acc:#FFFFFF;
  --hg:#A56A00; --hg-soft:#FFF0C2}
@media (prefers-color-scheme:dark){:root[data-skin="rosa"]:not([data-theme="light"]){
  --paper:#261424; --grid:#331B30; --card:#36202F; --ink:#FFEAF2; --muted:#D9B0C7; --line:#5C3553;
  --focus:#FF9CC4; --star:#FFD43B;
  --hg:#FFD95A; --hg-soft:#4A3A14}}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font-body); color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; -webkit-text-size-adjust:100%;
}
main{max-width:760px;margin:0 auto;padding:18px 16px 48px}
h1,h2,h3{font-family:var(--font-display);margin:0}
button{font-family:inherit;cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{text-align:center;margin-bottom:18px}
.top h1{font-size:1.7rem;line-height:1.15}
.top .sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.top.small{display:flex;align-items:center;justify-content:space-between;text-align:left;margin-bottom:10px}
.fita{width:26px;height:26px;object-fit:contain;vertical-align:middle;background:transparent;border:0}
.cont{font-weight:800;color:var(--muted)}

.mini{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);font-weight:800;font-size:.95rem}
.btn{display:block;width:100%;min-height:56px;padding:14px 18px;border-radius:16px;
  border:2px solid var(--acc);background:var(--acc-soft);color:var(--ink);font-weight:800;font-size:1.1rem;
  font-family:var(--font-display)}
.btn.jogar{width:auto;flex:none}
.say{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}

.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.cards{display:flex;flex-direction:column;gap:12px}
.fase{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fase .ico{font-size:2rem;line-height:1}
.fase .txt{flex:1 1 200px}
.fase h2{font-size:1.2rem}
.fase .sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.fase .marca{margin:6px 0 0;color:var(--acc);font-weight:800;font-size:.95rem}
.passos{margin:0;padding-left:1.2em;font-weight:700}
.passos li{margin:2px 0}

.bar{height:14px;background:var(--card);border:2px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s ease}

/* ---- áreas de encaixe ---- */
.alvos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.alvo{background:var(--card);border:3px dashed var(--line);border-radius:20px;padding:12px;text-align:center;
  transition:border-color .15s,box-shadow .15s,background .15s;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:8px}
.alvo .foto{width:100%;max-height:150px;object-fit:cover;border-radius:14px;border:2px solid var(--line)}
.alvo .ico{width:74px;height:74px;object-fit:contain}
.alvo .nome{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.alvo.quase{border-color:var(--acc);background:var(--acc-soft)}
.alvo.brilho{animation:brilho .9s ease 2}
@keyframes brilho{50%{box-shadow:0 0 0 8px var(--acc-soft);border-color:var(--acc)}}
.encaixados{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;margin-top:auto}

/* ---- peças ---- */
.bandeja{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:120px;
  border:2px solid var(--line);border-radius:20px;background:var(--card);padding:14px}
.peca{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;
  background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:104px;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.peca img{width:64px;height:64px;object-fit:contain;pointer-events:none}
.peca.foto img{width:150px;height:100px;object-fit:cover;border-radius:12px}
.peca .nome{font-weight:800;font-size:.95rem;pointer-events:none}
.peca.sel{border-color:var(--focus);box-shadow:0 0 0 5px var(--focus-soft,rgba(42,85,196,.25));transform:scale(1.06)}
.peca.arrastando{pointer-events:none;z-index:60;position:relative;box-shadow:0 14px 28px rgba(0,0,0,.35);cursor:grabbing}
.peca.pulso{animation:pulso .45s ease 3}
@keyframes pulso{50%{transform:scale(1.09);border-color:var(--focus)}}
.peca.encaixada{min-width:0;padding:6px;border-color:var(--ok);background:var(--ok-soft);cursor:default}
.peca.encaixada img{width:54px;height:54px}
.peca.encaixada.foto img{width:110px;height:74px}
.peca.encaixada .nome{display:none}
.peca.encaixada::after{content:'✓';position:absolute;margin-top:-6px;margin-left:74px;color:var(--ok);font-weight:900}

.feed{font-weight:700;margin:14px 0 0;min-height:1.4em;text-align:center}
.feed.ok{color:var(--ok)}
.feed.bad{color:var(--bad)}
.rodape{margin:22px 0 0;text-align:center;font-size:.95rem}
.rodape a{margin:0 8px}

.fim{text-align:center}
.fim .estrelas{font-size:2rem;letter-spacing:4px;margin:10px 0}
.fim .resumo{font-family:var(--font-display);font-size:1.5rem;margin:8px 0 0}
.fim .msg{color:var(--muted);margin:8px 0 0}
.fim .acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.fim .acoes .btn{width:auto}
.detalhes{margin-top:22px;color:var(--muted);font-size:.85rem}
.detalhes summary{font-weight:800;cursor:pointer}
.detalhes li{margin:3px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Jogo da Pecuária — arrasta e solta (p. 86, 87) =====
   Conteúdo do livro: produtos (leite, ovos, lã) e as formas de criação
   (extensiva = solto no pasto × intensiva = confinado no curral/estábulo).
   Imagens: Twemoji (CC-BY 4.0) e fotos do Wikimedia Commons — ver creditos-fotos.md. */

const KEY='treino3ano.jogo.peca.v1';
let prog={};
try{const r=localStorage.getItem(KEY);if(r)prog=JSON.parse(r)||{}}catch(e){}
const saveProg=()=>{try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}};
try{const t=JSON.parse(localStorage.getItem('treino3ano.v1')||'{}');document.documentElement.dataset.skin=(t&&t.skin)==='rosa'?'rosa':'azul'}catch(e){}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- voz ---------- */
const canSpeak=()=>'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function speak(text,rate){
  try{if(!canSpeak()||!text)return;window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=rate||0.85;
    window.speechSynthesis.speak(u)}catch(e){}
}
const audioRow=()=>'<div class="say audio"><button type="button" class="mini" data-a="0.85">🔊 Ouvir</button>'
  +'<button type="button" class="mini" data-a="0.55">🐢 Devagar</button></div>'
  +(canSpeak()?'':'<p class="hint">Este aparelho não fala. Peça a um adulto para ler em voz alta.</p>');

/* ---------- conteúdo ---------- */
const FASES=[
 {id:'a1',icone:'🧺',nome:'O que cada bicho nos dá',
  instrucao:'Arraste cada produto para o bicho certo.',
  alvos:[{id:'vaca',ico:'../../img/jogo/pec/emoji/vaca.svg',nome:'Vaca'},
         {id:'galinha',ico:'../../img/jogo/pec/emoji/galinha.svg',nome:'Galinha'},
         {id:'ovelha',ico:'../../img/jogo/pec/emoji/ovelha.svg',nome:'Ovelha'}],
  pecas:[{id:'leite',alvo:'vaca',ico:'../../img/jogo/pec/emoji/leite.svg',nome:'Leite',
          msg:'O leite vem da vaca.'},
         {id:'ovos',alvo:'galinha',ico:'../../img/jogo/pec/emoji/ovos.svg',nome:'Ovos',
          msg:'Os ovos vêm da galinha.'},
         {id:'la',alvo:'ovelha',ico:'../../img/jogo/pec/emoji/la.svg',nome:'Lã',
          msg:'A lã vem da ovelha.'}]},

 {id:'a2',icone:'🐄',nome:'Solto ou confinado?',
  instrucao:'Arraste cada foto para o lugar certo.',
  alvos:[{id:'solto',foto:'../../img/hga/pec/pasto.jpg',nome:'Solto no pasto'},
         {id:'confinado',foto:'../../img/hga/pec/curral.jpg',nome:'Confinado no curral'}],
  pecas:[{id:'f1',alvo:'solto',foto:'../../img/jogo/pec/gado-solto-1.jpg',nome:'Foto de gado',alt:'Foto de gado',
          msg:'Este gado está solto no pasto.'},
         {id:'f2',alvo:'confinado',foto:'../../img/jogo/pec/gado-confinado-1.jpg',nome:'Foto de gado',alt:'Foto de gado',
          msg:'Este gado está confinado, cercado.'},
         {id:'f3',alvo:'solto',foto:'../../img/jogo/pec/gado-solto-2.jpg',nome:'Foto de gado',alt:'Foto de gado',
          msg:'Este gado está solto no pasto.'},
         {id:'f4',alvo:'confinado',foto:'../../img/jogo/pec/gado-confinado-2.jpg',nome:'Foto de gado',alt:'Foto de gado',
          msg:'Este gado está confinado, cercado.'}]}
];

const CREDITOS=[
 'Fotos de gado: Orbitalscreams (CC BY-SA 4.0), David Dixon (CC BY-SA 2.0), Quintin Soloviev (CC0), Billy Hathorn/AlanAdler (CC BY-SA 3.0) — Wikimedia Commons.',
 'Ícones de animais e produtos: Twemoji, CC-BY 4.0.',
 'Fotos de pasto e curral: livro do 3º ano, p. 86 e 87.'
];

const app=document.getElementById('app');
let S=null;                       /* {fase, colocadas, primeiras} */
let sel=null, arrasto=null, movendo=false;

/* ---------- telas ---------- */
function renderHome(){
  sel=null;arrasto=null;movendo=false;
  app.innerHTML=`
  <header class="top">
    <h1><img class="fita" src="../../img/fita-autismo.png" alt=""> Jogo da Pecuária</h1>
    <p class="sub">Arrasta e solta · História e Geo (base livro) · p. 86, 87</p>
  </header>
  <section class="cards">
    ${FASES.map(f=>{
      const b=prog[f.id];
      return `<article class="card fase">
        <span class="ico" aria-hidden="true">${f.icone}</span>
        <div class="txt">
          <h2>${esc(f.nome)}</h2>
          <p class="sub">${esc(f.instrucao)}</p>
          ${b!=null?`<p class="marca">⭐ ${b} de ${f.pecas.length} certas de primeira.</p>`:''}
        </div>
        <button type="button" class="btn jogar" data-fase="${f.id}">Jogar</button>
      </article>`}).join('')}
  </section>
  <p class="rodape"><a href="jogo-pecuaria-perguntas.html">🎯 Jogo de perguntas</a> · <a href="../../index.html">← Treino</a></p>
  <details class="detalhes"><summary>Créditos das fotos</summary><ul>${CREDITOS.map(c=>'<li>'+esc(c)+'</li>').join('')}</ul></details>`;
  app.querySelectorAll('[data-fase]').forEach(b=>b.onclick=()=>comecar(b.dataset.fase));
}

function comecar(faseId){
  const fase=FASES.find(f=>f.id===faseId);
  if(!fase)return;
  S={fase,colocadas:0,primeiras:0};
  renderJogo();
}

function renderJogo(){
  const f=S.fase,n=f.pecas.length;
  app.innerHTML=`
  <header class="top small">
    <button type="button" class="mini" id="sair">← Fases</button>
    <span class="cont">${S.colocadas}/${n}</span>
  </header>
  <div class="bar" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.colocadas}">
    <i style="width:${Math.round(S.colocadas/n*100)}%"></i>
  </div>
  <section class="card">
    <h2 class="fase-nome" style="color:var(--acc);font-size:1rem;margin-bottom:10px">${f.icone} ${esc(f.nome)}</h2>
    <p class="pergunta" style="font-family:var(--font-display);font-size:1.3rem;margin:0">${esc(f.instrucao)}</p>
    ${audioRow()}
    <p class="hint">Pode arrastar com o dedo. Ou toque na peça e depois no lugar certo.</p>
    <div class="alvos" id="alvos" style="margin-top:16px">
      ${f.alvos.map(a=>`<div class="alvo" data-id="${a.id}" role="button" tabindex="0"
          aria-label="${esc(a.nome)}">
        ${a.foto?`<img class="foto" src="${esc(a.foto)}" alt="">`
                :`<img class="ico" src="${esc(a.ico)}" alt="">`}
        <span class="nome">${esc(a.nome)}</span>
        <span class="encaixados"></span>
      </div>`).join('')}
    </div>
    <div class="bandeja" id="bandeja">
      ${f.pecas.map(p=>`<div class="peca${p.foto?' foto':''}" data-id="${p.id}" data-alvo="${p.alvo}"
          data-msg="${esc(p.msg)}" data-tent="0" role="button" tabindex="0"
          aria-label="${esc(p.alt||p.nome)}">
        <img src="${esc(p.ico||p.foto)}" alt="">
        ${p.alt?'':`<span class="nome">${esc(p.nome)}</span>`}
      </div>`).join('')}
    </div>
    <p class="feed" id="feed" aria-live="polite"></p>
  </section>
  <p class="rodape"><a href="../../index.html">← Treino</a></p>`;

  const alvoTxt=f.instrucao+' '+f.alvos.map(a=>a.nome+'.').join(' ');
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>speak(alvoTxt,+b.dataset.a));
  document.getElementById('sair').onclick=renderHome;

  app.querySelectorAll('.peca').forEach(ligarPeca);
  app.querySelectorAll('.alvo').forEach(ligarAlvo);
  window.scrollTo(0,0);
}

function ligarAlvo(alvo){
  const tentar=()=>{ if(sel) soltar(sel,alvo); };
  alvo.addEventListener('click',tentar);
  alvo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tentar();}});
}

function ligarPeca(el){
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selecionar(el);}});

  el.addEventListener('pointerdown',e=>{
    if(el.dataset.feita)return;
    e.preventDefault();
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    arrasto={el,id:e.pointerId,x0:e.clientX,y0:e.clientY};
    movendo=false;
  });
  el.addEventListener('pointermove',e=>{
    if(!arrasto||arrasto.id!==e.pointerId)return;
    const dx=e.clientX-arrasto.x0, dy=e.clientY-arrasto.y0;
    if(!movendo&&Math.hypot(dx,dy)<8)return;
    movendo=true;
    el.classList.add('arrastando');
    el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.05)';
    marcarAlvo(e.clientX,e.clientY);
  });
  const termina=e=>{
    if(!arrasto||arrasto.id!==e.pointerId)return;
    const foi=movendo;
    el.classList.remove('arrastando');
    el.style.transform='';
    if(sel&&sel!==el)sel.classList.remove('sel');
    sel=null;
    arrasto=null;movendo=false;
    limparAlvos();
    if(foi){
      const alvo=alvoEm(e.clientX,e.clientY);
      if(alvo)soltar(el,alvo);
      else pulso(el);
    } else {
      selecionar(el);
    }
  };
  el.addEventListener('pointerup',termina);
  el.addEventListener('pointercancel',()=>{
    el.classList.remove('arrastando');el.style.transform='';
    if(sel&&sel!==el)sel.classList.remove('sel');
    sel=null;arrasto=null;movendo=false;limparAlvos();
  });
}

const alvoEm=(x,y)=>{
  const a=document.elementFromPoint(x,y);
  return a?a.closest('.alvo'):null;
};
const marcarAlvo=(x,y)=>{limparAlvos();const a=alvoEm(x,y);if(a)a.classList.add('quase')};
const limparAlvos=()=>app.querySelectorAll('.alvo.quase').forEach(a=>a.classList.remove('quase'));
const pulso=el=>{el.classList.add('pulso');setTimeout(()=>el.classList.remove('pulso'),1400)};

function selecionar(el){
  if(el.dataset.feita)return;
  if(sel===el){sel.classList.remove('sel');sel=null;return}
  if(sel)sel.classList.remove('sel');
  sel=el;el.classList.add('sel');
  const p=nomeDaPeca(el);
  if(p&&!el.classList.contains('foto'))speak(p,0.85);
}

const nomeDaPeca=el=>{
  const n=el.querySelector('.nome');
  return n?n.textContent:(el.dataset.msg||'');
};

/* ---------- ação principal: largar a peça no lugar ---------- */
function soltar(peca,alvo){
  if(peca.dataset.feita)return;
  const certo=peca.dataset.alvo===alvo.dataset.id;
  const tent=+peca.dataset.tent||0;

  if(certo){
    peca.dataset.feita='1';
    if(tent===0)S.primeiras++;
    peca.classList.add('encaixada');
    const cx=alvo.querySelector('.encaixados');
    if(cx)cx.appendChild(peca);
    const nome=alvo.querySelector('.nome');
    diz('✓ '+peca.dataset.msg,true);
    speak(peca.dataset.msg,0.85);
    S.colocadas++;
    const bar=app.querySelector('.bar');
    if(bar){bar.querySelector('i').style.width=Math.round(S.colocadas/S.fase.pecas.length*100)+'%';
      bar.setAttribute('aria-valuenow',S.colocadas)}
    const cd=app.querySelector('.cont');if(cd)cd.textContent=S.colocadas+'/'+S.fase.pecas.length;
    if(S.colocadas===S.fase.pecas.length)setTimeout(renderFim,900);
  }else{
    peca.dataset.tent=tent+1;
    diz('✗ '+peca.dataset.msg,false);
    speak(peca.dataset.msg,0.85);
    pulso(peca);
    /* no modo toque a peça continua selecionada: é só tocar no lugar certo de novo */
    const bom=app.querySelector('.alvo[data-id="'+peca.dataset.alvo+'"]');
    if(bom){bom.classList.add('brilho');setTimeout(()=>bom.classList.remove('brilho'),2200)}
  }
}

function diz(txt,ok){
  const f=document.getElementById('feed');
  if(!f)return;
  f.textContent=txt;
  f.className='feed '+(ok?'ok':'bad');
}

function renderFim(){
  const f=S.fase,n=f.pecas.length,a=S.primeiras;
  prog[f.id]=Math.max(prog[f.id]||0,a);
  saveProg();
  const estrelas='⭐'.repeat(a)+'☆'.repeat(n-a);
  const msg=a===n?'Você acertou tudo de primeira! Muito bem!'
    :(a===n-1?'Muito bem! Quase tudo de primeira.'
    :'Você acertou '+a+' de '+n+' de primeira. Pode jogar de novo.');
  app.innerHTML=`
  <section class="card fim">
    <h2 style="color:var(--acc);font-size:1rem">${f.icone} ${esc(f.nome)}</h2>
    <p class="estrelas" aria-hidden="true">${estrelas}</p>
    <p class="resumo">Tudo no lugar! ${n} de ${n} peças.</p>
    <p class="msg">${esc(msg)}</p>
    <div class="acoes">
      <button type="button" class="btn" id="denovo">Jogar de novo</button>
      <button type="button" class="btn" id="fases">Outras fases</button>
    </div>
  </section>
  <p class="rodape"><a href="jogo-pecuaria-perguntas.html">🎯 Jogo de perguntas</a> · <a href="../../index.html">← Treino</a></p>`;
  document.getElementById('denovo').onclick=()=>comecar(f.id);
  document.getElementById('fases').onclick=renderHome;
  speak('Tudo no lugar! Você acertou '+a+' de '+n+' de primeira.',0.85);
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
