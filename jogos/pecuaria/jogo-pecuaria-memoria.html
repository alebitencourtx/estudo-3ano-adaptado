<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memória do pasto e do curral — Jogos do 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../jogo-kit.css">
<script src="../jogo-kit.js"></script>
<style>
/* ===== Memória do pasto e do curral — ajustes locais (o resto vem do jogo-kit.css) =====
   Regras TEA: sem cronômetro, sem erro punido, poucas opções, feedback imediato. */
.tabuleiro{grid-template-columns:repeat(4,1fr)}          /* 8 cartas = 2 linhas de 4 (cabe na tela) */
.carta{flex-direction:column;gap:6px;cursor:pointer}
.carta .verso{font-size:2rem;line-height:1}
.carta.virada img{width:64%;height:auto;max-height:64%;object-fit:contain}
.carta .nome{font-size:.9rem}
.carta.travada{cursor:default}
.recorde{color:var(--muted);font-size:.9rem;margin:10px 0 0;text-align:center;font-weight:700}
@media (max-width:420px){
  .tabuleiro{gap:8px}
  .carta{padding:4px}
  .carta .verso{font-size:1.4rem}
  .carta .nome{font-size:.75rem}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Memória do pasto e do curral — jogo da memória (pecuária, p. 86) =====
   Encontre os dois pares de fotos do livro: gado solto e gado confinado.
   2 pares (4 cartas). Sem cronômetro: o placar guarda o MENOR número de tentativas.
   Imagens: emojis Twemoji (CC-BY 4.0). */

const BICHOS = [
  { id:'extensiva', nome:'Pecuária extensiva', ico:'../../img/hga/pec/pasto.jpg',
    frase:'Na extensiva, os animais são criados soltos em grandes áreas.' },
  { id:'intensiva', nome:'Pecuária intensiva', ico:'../../img/hga/pec/curral.jpg',
    frase:'Na intensiva, os animais são criados confinados.' }
];
const TOTAL = 2;                 /* 2 pares = 4 cartas */
const ID_PROG = 'mem-pec';       /* chave do progresso (menor nº de tentativas) */
const ESPERA = 900;              /* ms com as 2 cartas diferentes abertas */
const INSTRUCAO = 'Encontre os dois pares de fotos iguais.';

const app = document.getElementById('app');
let S = null;                    /* estado da partida */
let timer = null;                /* setTimeout das cartas diferentes */

/* ---------- progresso: guardar o MENOR número de tentativas ---------- */
function lerRecorde() {
  const p = JogoKit.progresso.ler();
  const r = p[ID_PROG];
  return (typeof r === 'number' && isFinite(r)) ? r : null;
}
function gravarRecorde(n) {
  const antigo = lerRecorde();
  if (antigo == null || n < antigo) JogoKit.progresso.gravar(ID_PROG, n);    /* menor é melhor */
  return antigo == null || n < antigo;
}

/* ---------- conteúdo ---------- */
const rodape = '<p class="rodape"><a href="index.html">← Todos os jogos do tópico</a> · <a href="../index.html">← Todos os tópicos</a> · <a href="../../index.html">← Treino</a></p>'
  + '<details class="detalhes"><summary>Créditos das imagens</summary><ul>'
  + '<li>Fotos do livro didático do 3º ano, página 86: gado solto no pasto e gado confinado no curral.</li>'
  + '</ul></details>';

/* ---------- telas ---------- */
function comecar() {
  if (timer) { clearTimeout(timer); timer = null; }
  S = { pares:0, tentativas:0, primeira:null, trava:false };
  renderJogo();
}

function renderJogo() {
  const rec = lerRecorde();
  const cartas = JogoKit.embaralhar(BICHOS.concat(BICHOS));      /* 2 pares embaralhados */
  app.innerHTML =
      '<h1 class="sr-only">Memória do pasto e do curral</h1>' +
    '<jogo-topo icone="🐄" titulo="Memória do pasto e do curral" contador="0/' + TOTAL + '" rotulo-voltar="← Fases"></jogo-topo>' +
    '<barra-progresso valor="0" total="' + TOTAL + '"></barra-progresso>' +
    '<section class="card">' +
      '<p class="pergunta" id="instrucao">' + INSTRUCAO + '</p>' +
      '<fala-botoes texto="' + INSTRUCAO + '"></fala-botoes>' +
      '<div class="tabuleiro" id="tabuleiro" aria-label="Cartas do jogo" style="margin-top:16px">' +
        cartas.map(cartaHtml).join('') +
      '</div>' +
      '<p class="feed" id="feed" aria-live="polite"></p>' +
      '<p class="recorde" id="recorde">' +
        (rec == null ? 'Encontre as duas fotos iguais.'
                     : 'Seu recorde: ' + rec + (rec === 1 ? ' tentativa.' : ' tentativas.')) +
      '</p>' +
    '</section>' + rodape;

  app.querySelectorAll('.carta').forEach(ligarCarta);
  atualizarProgresso();
  window.scrollTo(0, 0);
}

function cartaHtml(b) {
  return '<div class="carta" data-bicho="' + JogoKit.esc(b.id) + '" role="button" tabindex="0" ' +
    'aria-label="Carta fechada"><span class="verso">?</span></div>';
}

function virar(carta) {
  const b = BICHOS.find(x => x.id === carta.dataset.bicho);
  if (!b) return;
  carta.classList.add('virada');
  carta.innerHTML = '<img src="' + JogoKit.esc(b.ico) + '" alt=""><span class="nome">' + JogoKit.esc(b.nome) + '</span>';
  carta.setAttribute('aria-label', b.nome);
}

function fechar(carta) {
  carta.classList.remove('virada');
  carta.innerHTML = '<span class="verso">?</span>';
  carta.setAttribute('aria-label', 'Carta fechada');
}

function ligarCarta(carta) {
  carta.addEventListener('click', () => tocar(carta));
  carta.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocar(carta); }
  });
}

/* ---------- ação principal: tocar numa carta ---------- */
function tocar(carta) {
  if (S.trava) return;
  if (carta.classList.contains('travada') || carta.classList.contains('virada')) return;

  virar(carta);
  if (!S.primeira) { S.primeira = carta; return; }      /* primeira carta: só abre */

  const a = S.primeira, b = carta;
  S.primeira = null;
  S.tentativas++;

  if (a.dataset.bicho === b.dataset.bicho) {            /* iguais: as duas ficam travadas */
    const bi = BICHOS.find(x => x.id === a.dataset.bicho);
    [a, b].forEach(c => { c.classList.add('travada'); c.setAttribute('aria-label', bi.nome + ', igual'); });
    diz('✓ ' + bi.frase, 'ok');
    JogoKit.falar(bi.frase, 0.85);
    S.pares++;
    atualizarProgresso();
    if (S.pares === TOTAL) {
      S.trava = true;
      timer = setTimeout(() => { timer = null; mostrarFim(); }, ESPERA);
    }
  } else {                                              /* diferentes: nunca punir */
    S.trava = true;
    diz('As duas cartas são diferentes.', '');
    JogoKit.falar('As duas cartas são diferentes.', 0.85);
    timer = setTimeout(() => {
      timer = null;
      fechar(a); fechar(b);
      S.trava = false;
    }, ESPERA);
  }
}

function atualizarProgresso() {
  const topo = app.querySelector('jogo-topo');
  if (topo) topo.contador = S.pares + '/' + TOTAL;
  const barra = app.querySelector('barra-progresso');
  if (barra) barra.atualizar(S.pares, TOTAL);
}

function diz(txt, tipo) {
  const f = document.getElementById('feed');
  if (!f) return;
  f.textContent = txt;                                  /* neutro = sem cor de erro */
  f.className = 'feed' + (tipo ? ' ' + tipo : '');
}

/* ---------- tela final ---------- */
function mostrarFim() {
  const rec = lerRecorde();
  const novo = gravarRecorde(S.tentativas);
  const recorde = novo ? S.tentativas : rec;
  const msg = (novo && rec != null ? 'Novo recorde! ' : '') +
    'Você fez os 2 pares em ' + S.tentativas + (S.tentativas === 1 ? ' tentativa. ' : ' tentativas. ') +
    'Seu recorde: ' + recorde + (recorde === 1 ? ' tentativa.' : ' tentativas.');

  app.innerHTML =
    '<h1 class="sr-only">Memória do pasto e do curral</h1>' +
    '<tela-fim icone="🐄" titulo="Memória do pasto e do curral" estrelas="' + TOTAL + '" total="' + TOTAL + '" ' +
      'resumo="Você achou os 2 pares!" msg="' + JogoKit.esc(msg) + '"></tela-fim>' + rodape;
  JogoKit.falar('Você achou os 2 pares!', 0.85);
  window.scrollTo(0, 0);
}

/* ---------- eventos dos componentes do kit ---------- */
app.addEventListener('voltar', () => { location.href = 'index.html'; });
app.addEventListener('fim', e => {
  if (e.detail && e.detail.acao === 'denovo') comecar();
  else location.href = 'index.html';
});

comecar();
</script>
</body>
</html>
